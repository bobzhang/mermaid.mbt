<svg id="mermaid-svg" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 900px;" viewBox="0 0 900 600" role="graphics-document document" aria-roledescription="wardley"><g class="wardley-map"><rect class="wardley-background" width="900" height="600" fill="white"></rect><g class="wardley-axes"><line x1="48" x2="852" y1="552" y2="552" stroke="#333333" stroke-width="1"></line><line x1="48" x2="48" y1="48" y2="552" stroke="#333333" stroke-width="1"></line><text class="wardley-axis-label wardley-axis-label-x" x="450" y="588" fill="#131300" font-size="12" font-weight="bold" text-anchor="middle">Evolution</text><text class="wardley-axis-label wardley-axis-label-y" x="16" y="300" fill="#131300" font-size="12" font-weight="bold" text-anchor="middle" transform="rotate(-90 16 300)">Visibility</text></g><g class="wardley-stages"><text class="wardley-stage-label" x="180.66" y="568" fill="#131300" font-size="10" text-anchor="middle">First stage / alt name</text><line x1="313.32" x2="313.32" y1="48" y2="552" stroke="#000" stroke-width="1" stroke-dasharray="5 5" opacity="0.8"></line><text class="wardley-stage-label" x="542.46" y="568" fill="#131300" font-size="10" text-anchor="middle">Second</text></g><g class="wardley-links"></g><g class="wardley-trends"></g><g class="wardley-nodes"></g></g><defs><marker id="arrow-mermaid-svg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc3545" stroke="none"></path></marker><marker id="link-arrow-end-mermaid-svg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#333333" stroke="none"></path></marker><marker id="link-arrow-start-mermaid-svg" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 10 0 L 0 5 L 10 10 z" fill="#333333" stroke="none"></path></marker></defs></svg>