<svg id="mermaid-svg" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 500px;" viewBox="0 0 500 500" role="graphics-document document" aria-roledescription="quadrantChart"><style>#mermaid-svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#ccc;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mermaid-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mermaid-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mermaid-svg .error-icon{fill:#a44141;}#mermaid-svg .error-text{fill:#ddd;stroke:#ddd;}#mermaid-svg .edge-thickness-normal{stroke-width:1px;}#mermaid-svg .edge-thickness-thick{stroke-width:3.5px;}#mermaid-svg .edge-pattern-solid{stroke-dasharray:0;}#mermaid-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#mermaid-svg .edge-pattern-dashed{stroke-dasharray:3;}#mermaid-svg .edge-pattern-dotted{stroke-dasharray:2;}#mermaid-svg .marker{fill:lightgrey;stroke:lightgrey;}#mermaid-svg .marker.cross{stroke:lightgrey;}#mermaid-svg svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#mermaid-svg p{margin:0;}#mermaid-svg .node .neo-node{stroke:#ccc;}#mermaid-svg [data-look="neo"].node rect,#mermaid-svg [data-look="neo"].cluster rect,#mermaid-svg [data-look="neo"].node polygon{stroke:url(#mermaid-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaid-svg [data-look="neo"].swimlane.cluster rect{filter:none;}#mermaid-svg [data-look="neo"].node path{stroke:url(#mermaid-svg-gradient);stroke-width:1px;}#mermaid-svg [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaid-svg [data-look="neo"].node .neo-line path{stroke:#ccc;filter:none;}#mermaid-svg [data-look="neo"].node circle{stroke:url(#mermaid-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaid-svg [data-look="neo"].node circle .state-start{fill:#000000;}#mermaid-svg [data-look="neo"].icon-shape .icon{fill:url(#mermaid-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaid-svg [data-look="neo"].icon-shape .icon-neo path{stroke:url(#mermaid-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaid-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g></g><g class="main"><g class="quadrants"><g class="quadrant"><rect x="263" y="45" width="232" height="212" fill="#1f2020"></rect><text x="0" y="0" fill="#e0dfdf" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(379, 50) rotate(0)">One</text></g><g class="quadrant"><rect x="31" y="45" width="232" height="212" fill="#242525"></rect><text x="0" y="0" fill="#dbdada" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(147, 50) rotate(0)">Two</text></g><g class="quadrant"><rect x="31" y="257" width="232" height="212" fill="#292a2a"></rect><text x="0" y="0" fill="#d6d5d5" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(147, 262) rotate(0)">Three</text></g><g class="quadrant"><rect x="263" y="257" width="232" height="212" fill="#2e2f2f"></rect><text x="0" y="0" fill="#d1d0d0" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(379, 262) rotate(0)">Four</text></g></g><g class="border"><line x1="30" y1="45" x2="496" y2="45" style="stroke: rgb(204, 204, 204); stroke-width: 2;"></line><line x1="495" y1="46" x2="495" y2="468" style="stroke: rgb(204, 204, 204); stroke-width: 2;"></line><line x1="30" y1="469" x2="496" y2="469" style="stroke: rgb(204, 204, 204); stroke-width: 2;"></line><line x1="31" y1="46" x2="31" y2="468" style="stroke: rgb(204, 204, 204); stroke-width: 2;"></line><line x1="263" y1="46" x2="263" y2="468" style="stroke: rgb(204, 204, 204); stroke-width: 1;"></line><line x1="32" y1="257" x2="494" y2="257" style="stroke: rgb(204, 204, 204); stroke-width: 1;"></line></g><g class="data-points"><g class="data-point"><circle cx="309.4" cy="299.4" r="8" fill="#f00" stroke="hsl(180, 1.5873015873%, NaN%)" stroke-width="0px"></circle><text x="0" y="0" fill="#e0dfdf" font-size="12" dominant-baseline="hanging" text-anchor="middle" transform="translate(309.4, 304.4) rotate(0)">Beta</text></g><g class="data-point"><circle cx="147" cy="151" r="5" fill="hsl(180, 1.5873015873%, NaN%)" stroke="hsl(180, 1.5873015873%, NaN%)" stroke-width="0px"></circle><text x="0" y="0" fill="#e0dfdf" font-size="12" dominant-baseline="hanging" text-anchor="middle" transform="translate(147, 156) rotate(0)">Alpha</text></g></g><g class="labels"><g class="label"><text x="0" y="0" fill="#e0dfdf" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(147, 479) rotate(0)">Low</text></g><g class="label"><text x="0" y="0" fill="#e0dfdf" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(379, 479) rotate(0)">High</text></g><g class="label"><text x="0" y="0" fill="#e0dfdf" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(5, 363) rotate(-90)">Bad</text></g><g class="label"><text x="0" y="0" fill="#e0dfdf" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(5, 151) rotate(-90)">Good</text></g></g><g class="title"><text x="0" y="0" fill="#e0dfdf" font-size="20" dominant-baseline="hanging" text-anchor="middle" transform="translate(250, 10) rotate(0)">Theme dark</text></g></g></svg>