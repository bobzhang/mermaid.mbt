<svg id="mermaid-svg" width="500.5" xmlns="http://www.w3.org/2000/svg" height="333.3" viewBox="0 0 500.5 333.3" role="graphics-document document" aria-roledescription="quadrantChart"><style>#mermaid-svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mermaid-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mermaid-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mermaid-svg .error-icon{fill:#552222;}#mermaid-svg .error-text{fill:#552222;stroke:#552222;}#mermaid-svg .edge-thickness-normal{stroke-width:1px;}#mermaid-svg .edge-thickness-thick{stroke-width:3.5px;}#mermaid-svg .edge-pattern-solid{stroke-dasharray:0;}#mermaid-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#mermaid-svg .edge-pattern-dashed{stroke-dasharray:3;}#mermaid-svg .edge-pattern-dotted{stroke-dasharray:2;}#mermaid-svg .marker{fill:#333333;stroke:#333333;}#mermaid-svg .marker.cross{stroke:#333333;}#mermaid-svg svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#mermaid-svg p{margin:0;}#mermaid-svg .node .neo-node{stroke:#9370DB;}#mermaid-svg [data-look="neo"].node rect,#mermaid-svg [data-look="neo"].cluster rect,#mermaid-svg [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].swimlane.cluster rect{filter:none;}#mermaid-svg [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#mermaid-svg [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#mermaid-svg [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].node circle .state-start{fill:#000000;}#mermaid-svg [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g></g><g class="main"><g class="quadrants"><g class="quadrant"><rect x="263.25" y="42.25" width="235" height="131.4" fill="#ECECFF"></rect><text x="0" y="0" fill="#131300" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(380.75, 47.25) rotate(0)"></text></g><g class="quadrant"><rect x="28.25" y="42.25" width="235" height="131.4" fill="#f1f1ff"></rect><text x="0" y="0" fill="#0e0e00" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(145.75, 47.25) rotate(0)"></text></g><g class="quadrant"><rect x="28.25" y="173.65" width="235" height="131.4" fill="#f6f6ff"></rect><text x="0" y="0" fill="#090900" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(145.75, 178.65) rotate(0)"></text></g><g class="quadrant"><rect x="263.25" y="173.65" width="235" height="131.4" fill="#fbfbff"></rect><text x="0" y="0" fill="#040400" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(380.75, 178.65) rotate(0)"></text></g></g><g class="border"><line x1="27.5" y1="42.25" x2="499" y2="42.25" style="stroke: rgb(199, 199, 241); stroke-width: 1.5;"></line><line x1="498.25" y1="43" x2="498.25" y2="304.3" style="stroke: rgb(199, 199, 241); stroke-width: 1.5;"></line><line x1="27.5" y1="305.05" x2="499" y2="305.05" style="stroke: rgb(199, 199, 241); stroke-width: 1.5;"></line><line x1="28.25" y1="43" x2="28.25" y2="304.3" style="stroke: rgb(199, 199, 241); stroke-width: 1.5;"></line><line x1="263.25" y1="43" x2="263.25" y2="304.3" style="stroke: rgb(199, 199, 241); stroke-width: 0.5;"></line><line x1="29" y1="173.65" x2="497.5" y2="173.65" style="stroke: rgb(199, 199, 241); stroke-width: 0.5;"></line></g><g class="data-points"><g class="data-point"><circle cx="357.25" cy="278.77000000000004" r="5" fill="hsl(240, 100%, NaN%)" stroke="hsl(240, 100%, NaN%)" stroke-width="0px"></circle><text x="0" y="0" fill="#131300" font-size="12" dominant-baseline="hanging" text-anchor="middle" transform="translate(357.25, 283.77000000000004) rotate(0)">Q</text></g><g class="data-point"><circle cx="75.25" cy="121.09000000000002" r="5" fill="hsl(240, 100%, NaN%)" stroke="hsl(240, 100%, NaN%)" stroke-width="0px"></circle><text x="0" y="0" fill="#131300" font-size="12" dominant-baseline="hanging" text-anchor="middle" transform="translate(75.25, 126.09000000000002) rotate(0)">P</text></g></g><g class="labels"><g class="label"><text x="0" y="0" fill="#131300" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(145.75, 312.3) rotate(0)">A</text></g><g class="label"><text x="0" y="0" fill="#131300" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(380.75, 312.3) rotate(0)">B</text></g><g class="label"><text x="0" y="0" fill="#131300" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(5, 239.35000000000002) rotate(-90)">C</text></g><g class="label"><text x="0" y="0" fill="#131300" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(5, 107.95) rotate(-90)">D</text></g></g><g class="title"><text x="0" y="0" fill="#131300" font-size="20" dominant-baseline="hanging" text-anchor="middle" transform="translate(250.25, 10) rotate(0)">Fractions</text></g></g></svg>