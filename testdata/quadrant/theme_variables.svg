<svg id="mermaid-svg" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 400px;" viewBox="0 0 400 400" role="graphics-document document" aria-roledescription="quadrantChart"><style>#mermaid-svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mermaid-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mermaid-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mermaid-svg .error-icon{fill:#552222;}#mermaid-svg .error-text{fill:#552222;stroke:#552222;}#mermaid-svg .edge-thickness-normal{stroke-width:1px;}#mermaid-svg .edge-thickness-thick{stroke-width:3.5px;}#mermaid-svg .edge-pattern-solid{stroke-dasharray:0;}#mermaid-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#mermaid-svg .edge-pattern-dashed{stroke-dasharray:3;}#mermaid-svg .edge-pattern-dotted{stroke-dasharray:2;}#mermaid-svg .marker{fill:#333333;stroke:#333333;}#mermaid-svg .marker.cross{stroke:#333333;}#mermaid-svg svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#mermaid-svg p{margin:0;}#mermaid-svg .node .neo-node{stroke:#9370DB;}#mermaid-svg [data-look="neo"].node rect,#mermaid-svg [data-look="neo"].cluster rect,#mermaid-svg [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].swimlane.cluster rect{filter:none;}#mermaid-svg [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#mermaid-svg [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#mermaid-svg [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].node circle .state-start{fill:#000000;}#mermaid-svg [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g></g><g class="main"><g class="quadrants"><g class="quadrant"><rect x="213" y="45" width="182" height="162" fill="#00ff00"></rect><text x="0" y="0" fill="#ff0000" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(304, 50) rotate(0)">One</text></g><g class="quadrant"><rect x="31" y="45" width="182" height="162" fill="rgb(1,2,3)"></rect><text x="0" y="0" fill="#0e0e00" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(122, 50) rotate(0)">Two</text></g><g class="quadrant"><rect x="31" y="207" width="182" height="162" fill="hsl(10, 50%, 50%)"></rect><text x="0" y="0" fill="#090900" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(122, 212) rotate(0)"></text></g><g class="quadrant"><rect x="213" y="207" width="182" height="162" fill="pink"></rect><text x="0" y="0" fill="#040400" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(304, 212) rotate(0)"></text></g></g><g class="border"><line x1="30" y1="45" x2="396" y2="45" style="stroke: red; stroke-width: 2;"></line><line x1="395" y1="46" x2="395" y2="368" style="stroke: red; stroke-width: 2;"></line><line x1="30" y1="369" x2="396" y2="369" style="stroke: red; stroke-width: 2;"></line><line x1="31" y1="46" x2="31" y2="368" style="stroke: red; stroke-width: 2;"></line><line x1="213" y1="46" x2="213" y2="368" style="stroke: rgb(0, 0, 255); stroke-width: 1;"></line><line x1="32" y1="207" x2="394" y2="207" style="stroke: rgb(0, 0, 255); stroke-width: 1;"></line></g><g class="data-points"><g class="data-point"><circle cx="213" cy="207" r="5" fill="#123456" stroke="#123456" stroke-width="0px"></circle><text x="0" y="0" fill="blue" font-size="12" dominant-baseline="hanging" text-anchor="middle" transform="translate(213, 212) rotate(0)">P</text></g></g><g class="labels"><g class="label"><text x="0" y="0" fill="#abc" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(122, 379) rotate(0)">A</text></g><g class="label"><text x="0" y="0" fill="#abc" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(304, 379) rotate(0)">B</text></g><g class="label"><text x="0" y="0" fill="#def" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(5, 288) rotate(-90)">C</text></g><g class="label"><text x="0" y="0" fill="#def" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(5, 126) rotate(-90)">D</text></g></g><g class="title"><text x="0" y="0" fill="#0a0b0c" font-size="20" dominant-baseline="hanging" text-anchor="middle" transform="translate(200, 10) rotate(0)">Theme variables</text></g></g></svg>