<svg id="mermaid-svg" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 112px;" viewBox="-20 177.1999969482422 112 145.59999084472656" role="graphics-document document" aria-roledescription="ishikawa"><style>#mermaid-svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mermaid-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mermaid-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mermaid-svg .error-icon{fill:#552222;}#mermaid-svg .error-text{fill:#552222;stroke:#552222;}#mermaid-svg .edge-thickness-normal{stroke-width:1px;}#mermaid-svg .edge-thickness-thick{stroke-width:3.5px;}#mermaid-svg .edge-pattern-solid{stroke-dasharray:0;}#mermaid-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#mermaid-svg .edge-pattern-dashed{stroke-dasharray:3;}#mermaid-svg .edge-pattern-dotted{stroke-dasharray:2;}#mermaid-svg .marker{fill:#333333;stroke:#333333;}#mermaid-svg .marker.cross{stroke:#333333;}#mermaid-svg svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#mermaid-svg p{margin:0;}#mermaid-svg .ishikawa .ishikawa-spine,#mermaid-svg .ishikawa .ishikawa-branch,#mermaid-svg .ishikawa .ishikawa-sub-branch{stroke:#333333;stroke-width:2;fill:none;}#mermaid-svg .ishikawa .ishikawa-sub-branch{stroke-width:1;}#mermaid-svg .ishikawa .ishikawa-arrow{fill:#333333;}#mermaid-svg .ishikawa .ishikawa-head{fill:#ECECFF;stroke:#333333;stroke-width:2;}#mermaid-svg .ishikawa .ishikawa-label-box{fill:#ECECFF;stroke:#333333;stroke-width:2;}#mermaid-svg .ishikawa text{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}#mermaid-svg .ishikawa .ishikawa-head-label{font-weight:600;text-anchor:middle;dominant-baseline:middle;font-size:14px;}#mermaid-svg .ishikawa .ishikawa-label{text-anchor:end;}#mermaid-svg .ishikawa .ishikawa-label.cause{text-anchor:middle;dominant-baseline:middle;}#mermaid-svg .ishikawa .ishikawa-label.align{text-anchor:end;dominant-baseline:middle;}#mermaid-svg .ishikawa .ishikawa-label.up{dominant-baseline:baseline;}#mermaid-svg .ishikawa .ishikawa-label.down{dominant-baseline:hanging;}#mermaid-svg .node .neo-node{stroke:#9370DB;}#mermaid-svg [data-look="neo"].node rect,#mermaid-svg [data-look="neo"].cluster rect,#mermaid-svg [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].swimlane.cluster rect{filter:none;}#mermaid-svg [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#mermaid-svg [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#mermaid-svg [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].node circle .state-start{fill:#000000;}#mermaid-svg [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g></g><g class="ishikawa"><defs><marker id="ishikawa-arrow-mermaid-svg" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 10 0 L 0 5 L 10 10 Z" class="ishikawa-arrow"></path></marker></defs><line class="ishikawa-spine" x1="0" y1="250" x2="0" y2="250"></line><g class="ishikawa-head-group" transform="translate(0,250)"><path class="ishikawa-head" d="M 0 -52.79999923706055 L 0 52.79999923706055 Q 144 0 0 -52.79999923706055 Z"></path><text class="ishikawa-head-label" text-anchor="start"