<svg id="mermaid-svg" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 179.9196014404297px;" viewBox="-87.91959381103516 156.67410278320312 179.9196014404297 149.32589721679688" role="graphics-document document" aria-roledescription="ishikawa"><style>#mermaid-svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mermaid-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mermaid-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mermaid-svg .error-icon{fill:#552222;}#mermaid-svg .error-text{fill:#552222;stroke:#552222;}#mermaid-svg .edge-thickness-normal{stroke-width:1px;}#mermaid-svg .edge-thickness-thick{stroke-width:3.5px;}#mermaid-svg .edge-pattern-solid{stroke-dasharray:0;}#mermaid-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#mermaid-svg .edge-pattern-dashed{stroke-dasharray:3;}#mermaid-svg .edge-pattern-dotted{stroke-dasharray:2;}#mermaid-svg .marker{fill:#333333;stroke:#333333;}#mermaid-svg .marker.cross{stroke:#333333;}#mermaid-svg svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#mermaid-svg p{margin:0;}#mermaid-svg .ishikawa .ishikawa-spine,#mermaid-svg .ishikawa .ishikawa-branch,#mermaid-svg .ishikawa .ishikawa-sub-branch{stroke:#333333;stroke-width:2;fill:none;}#mermaid-svg .ishikawa .ishikawa-sub-branch{stroke-width:1;}#mermaid-svg .ishikawa .ishikawa-arrow{fill:#333333;}#mermaid-svg .ishikawa .ishikawa-head{fill:#ECECFF;stroke:#333333;stroke-width:2;}#mermaid-svg .ishikawa .ishikawa-label-box{fill:#ECECFF;stroke:#333333;stroke-width:2;}#mermaid-svg .ishikawa text{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}#mermaid-svg .ishikawa .ishikawa-head-label{font-weight:600;text-ancho