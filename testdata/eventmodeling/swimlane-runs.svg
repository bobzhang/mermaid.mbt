<svg id="mermaid-svg" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 983px;" viewBox="-30 -30 983 470" role="graphics-document document" aria-roledescription="eventmodeling"><style>#mermaid-svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mermaid-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mermaid-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mermaid-svg .error-icon{fill:#552222;}#mermaid-svg .error-text{fill:#552222;stroke:#552222;}#mermaid-svg .edge-thickness-normal{stroke-width:1px;}#mermaid-svg .edge-thickness-thick{stroke-width:3.5px;}#mermaid-svg .edge-pattern-solid{stroke-dasharray:0;}#mermaid-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#mermaid-svg .edge-pattern-dashed{stroke-dasharray:3;}#mermaid-svg .edge-pattern-dotted{stroke-dasharray:2;}#mermaid-svg .marker{fill:#333333;stroke:#333333;}#mermaid-svg .marker.cross{stroke:#333333;}#mermaid-svg svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#mermaid-svg p{margin:0;}#mermaid-svg .node .neo-node{stroke:#9370DB;}#mermaid-svg [data-look="neo"].node rect,#mermaid-svg [data-look="neo"].cluster rect,#mermaid-svg [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].swimlane.cluster rect{filter:none;}#mermaid-svg [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#mermaid-svg [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#mermaid-svg [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].node circle .state-start{fill:#000000;}#mermaid-svg [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g></g><g class="em-swimlane"><rect x="0" y="0" rx="3" width="923" height="130" fill="rgb(250,250,250)" stroke="rgb(240,240,240)"></rect><text font-weight="bold" x="30" y="30">UI/Automation</text></g><g class="em-swimlane"><rect x="0" y="140" rx="3" width="923" height="130" fill="rgb(250,250,250)" stroke="rgb(240,240,240)"></rect><text font-weight="bold" x="30" y="170">Command/Read Model</text></g><g class="em-swimlane"><rect x="0" y="280" rx="3" width="923" height="130" fill="rgb(250,250,250)" stroke="rgb(240,240,240)"></rect><text font-weight="bold" x="30" y="310">Events</text></g><g class="em-box"><rect x="250" y="295" rx="3" width="112" height="100" stroke="#c19a0f" fill="#ffb778"></rect><foreignObject x="260" y="305" width="92" height="80"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; height: 100%; width: 100%;"><span style="display: table-cell; text-align: center; vertical-align: middle;"><b>A</b></span></div></foreignObject></g><g class="em-box"><rect x="372" y="295" rx="3" width="112" height="100" stroke="#c19a0f" fill="#ffb778"></rect><foreignObject x="382" y="305" width="92" height="80"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; height: 100%; width: 100%;"><span style="display: table-cell; text-align: center; vertical-align: middle;"><b>B</b></span></div></foreignObject></g><g class="em-box"><rect x="494" y="295" rx="3" width="112" height="100" stroke="#c19a0f" fill="#ffb778"></rect><foreignObject x="504" y="305" width="92" height="80"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; height: 100%; width: 100%;"