<svg id="mermaid-svg" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 471.765625px;" viewBox="-147.4375 -0.2209310531616211 471.765625 103.1049575805664" role="graphics-document document" aria-roledescription="sankey"><style>#mermaid-svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mermaid-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mermaid-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mermaid-svg .error-icon{fill:#552222;}#mermaid-svg .error-text{fill:#552222;stroke:#552222;}#mermaid-svg .edge-thickness-normal{stroke-width:1px;}#mermaid-svg .edge-thickness-thick{stroke-width:3.5px;}#mermaid-svg .edge-pattern-solid{stroke-dasharray:0;}#mermaid-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#mermaid-svg .edge-pattern-dashed{stroke-dasharray:3;}#mermaid-svg .edge-pattern-dotted{stroke-dasharray:2;}#mermaid-svg .marker{fill:#333333;stroke:#333333;}#mermaid-svg .marker.cross{stroke:#333333;}#mermaid-svg svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#mermaid-svg p{margin:0;}#mermaid-svg .label{font-family:"trebuchet ms",verdana,arial,sans-serif;}#mermaid-svg .node-labels{font-family:"trebuchet ms",verdana,arial,sans-serif;}#mermaid-svg .sankey-label-bg{stroke:#ECECFF;stroke-width:4px;stroke-linejoin:round;paint-order:stroke;}#mermaid-svg .sankey-label-fg{fill:#333;}#mermaid-svg .node rect{shape-rendering:crispEdges;}#mermaid-svg .link{fill:none;stroke-opacity:0.5;mix-blend-mode:multiply;}#mermaid-svg .node .neo-node{stroke:#9370DB;}#mermaid-svg [data-look="neo"].node rect,#mermaid-svg [data-look="neo"].cluster rect,#mermaid-svg [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].swimlane.cluster rect{filter:none;}#mermaid-svg [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#mermaid-svg [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#mermaid-svg [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].node circle .state-start{fill:#000000;}#mermaid-svg [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g></g><g class="nodes"><g class="node" id="node-1" transform="translate(0,0)" x="0" y="0"><rect height="65.91788980562436" width="10" fill="#4e79a7"></rect></g><g class="node" id="node-2" transform="translate(95,21.711459405452125)" x="95" y="21.711459405452125"><rect height="50.209911963034905" width="10" fill="#f28e2c"></rect></g><g class="node" id="node-3" transform="translate(190,0)" x="190" y="0"><rect height="15.758137594800282" width="10" fill="#e15759"></rect></g><g class="node" id="node-4" transform="translate(190,27.75813759480028)" x="190" y="27.75813759480028"><rect height="60.1917026529889" width="10" fill="#76b7b2"></rect></g><g class="node" id="node-5" transform="translate(0,77.91788980562436)" x="0" y="77.91788980562436"><rect height="0.05015975221081703" width="10" fill="#59a14f"></rect></g><g class="node" id="node-6" transform="translate(0,89.96804955783517)" x="0" y="89.96804955783517"><rect height="10.0319504421648" width="10" fill="#edc949"></rect></g></g><g class="node-labels" font-size="14"><text x="16" y="32.95894490281218" dy="0.35em" text-anchor="start">A very long source label that goes on and on</text><text x="111" y="46.81641538696958" dy="0.35em" text-anchor="start">Middle node with a long name too</text><text x="184" y="7.879068797400141" dy="0.35em" text-anchor="end">Another middle node with an even longer name here</text><text x="184" y="57.85398892129473" dy="0.35em" text-anchor="end">The final destination whose name is long</text><text x="16" y="77.94296968172976" dy="0.35em" text-anchor="start">Tiny</text><text x="16" y="94.98402477891757" dy="0.35em" text-anchor="start">gjpqy WAVE</text></g><g class="links" fill="none" stroke-opacity="0.5"><g class="link" style="mix-blend-mode: multiply;"><linearGradient id="linearGradient-7" gradientUnits="userSpaceOnUse" x1="10" x2="95"><stop offset="0%" stop-color="#4e79a7"></stop><stop offset="100%" stop-color="#f28e2c"></stop></linearGradient><path d="M10,40.838013700212315C52.5,40.838013700212315,52.5,46.79133551086416,95,46.79133551086416" stroke="url(#linearGradient-7)" stroke-width="50.159752210824074"></path></g><g class="link" style="mix-blend-mode: multiply;"><linearGradient id="linearGradient-8" gradientUnits="userSpaceOnUse" x1="10" x2="190"><stop offset="0%" stop-color="#4e79a7"></stop><stop offset="100%" stop-color="#e15759"></stop></linearGradient><path d="M10,7.87906879740014C100,7.87906879740014,100,7.87906879740014,190,7.87906879740014" stroke="url(#linearGradient-8)" stroke-width="15.75813759480028"></path></g><g class="link" style="mix-blend-mode: multiply;"><linearGradient id="linearGradient-9" gradientUnits="userSpaceOnUse" x1="105" x2="190"><stop offset="0%" stop-color="#f28e2c"></stop><stop offset="100%" stop-color="#76b7b2"></stop></linearGradient><path d="M105,46.79133551086416C147.5,46.79133551086416,147.5,52.838013700212315,190,52.838013700212315" stroke="url(#linearGradient-9)" stroke-width="50.159752210824074"></path></g><g class="link" style="mix-blend-mode: multiply;"><linearGradient id="linearGradient-10" gradientUnits="userSpaceOnUse" x1="10" x2="95"><stop offset="0%" stop-co