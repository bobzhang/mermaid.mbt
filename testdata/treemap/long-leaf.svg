<svg id="mermaid-svg" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="2 27 996 371" style="max-width: 996px;" class="flowchart" role="graphics-document document" aria-roledescription="treemap"><style>#mermaid-svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mermaid-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mermaid-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mermaid-svg .error-icon{fill:#552222;}#mermaid-svg .error-text{fill:#552222;stroke:#552222;}#mermaid-svg .edge-thickness-normal{stroke-width:1px;}#mermaid-svg .edge-thickness-thick{stroke-width:3.5px;}#mermaid-svg .edge-pattern-solid{stroke-dasharray:0;}#mermaid-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#mermaid-svg .edge-pattern-dashed{stroke-dasharray:3;}#mermaid-svg .edge-pattern-dotted{stroke-dasharray:2;}#mermaid-svg .marker{fill:#333333;stroke:#333333;}#mermaid-svg .marker.cross{stroke:#333333;}#mermaid-svg svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#mermaid-svg p{margin:0;}#mermaid-svg .treemapNode.section{stroke:black;stroke-width:1;fill:#efefef;}#mermaid-svg .treemapNode.leaf{stroke:black;stroke-width:1;fill:#efefef;}#mermaid-svg .treemapLabel{fill:#333;font-size:12px;}#mermaid-svg .treemapValue{fill:#333;font-size:10px;}#mermaid-svg .treemapTitle{fill:#333;font-size:14px;}#mermaid-svg .node .neo-node{stroke:#9370DB;}#mermaid-svg [data-look="neo"].node rect,#mermaid-svg [data-look="neo"].cluster rect,#mermaid-svg [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].swimlane.cluster rect{filter:none;}#mermaid-svg [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#mermaid-svg [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#mermaid-svg [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].node circle .state-start{fill:#000000;}#mermaid-svg [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g></g><g transform="translate(0, 0)" class="treemapContainer"><g class="treemapSection" transform="translate(0,0)"><rect width="1000" height="25" class="treemapSectionHeader" fill="none" fill-opacity="0.6" stroke-width="0.6" style="display: none;"></rect><clipPath id="clip-section-mermaid-svg-0"><rect width="988" height="25"></rect></clipPath><rect width="1000" height="400" class="treemapSection section0" fill="transparent" fill-opacity="0.6" stroke="transparent" stroke-width="2" stroke-opacity="0.4" style="display: none;"></rect><text class="treemapSectionLabel" x="6" y="12.5" dominant-baseline="middle" font-weight="bold" clip-path="url(#clip-section-mermaid-svg-0)" style="display: none;"></text><text class="treemapSectionValue" x="990" y="12.5" text-anchor="end" dominant-baseline="middle" font-style="italic" style="display: none;">4</text></g><g class="treemapSection" transform="translate(10,35)"><rect width="980" height="25" class="treemapSectionHeader" fill="none" fill-opacity="0.6" stroke-width="0.6" style=""></rect><clipPath id="clip-section-mermaid-svg-1"><rect width="968" height="25"></rect></clipPath><rect width="980" height="355" class="treemapSection section1" fill="hsl(240, 100%, 76.2745098039%)" fill-opacity="0.6" stroke="hsl(240, 100%, 61.2745098039%)" stroke-width="2" stroke-opacity="0.4" style=";"></rect><text class="treemapSectionLabel" x="6" y="12.5" dominant-baseline="middle" font-weight="bold" clip-path="url(#clip-section-mermaid-svg-1)" style="dominant-baseline: middle; font-size: 12px; fill:#ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">S</text><text class="treemapSectionValue" x="970" y="12.5" text-anchor="end" dominant-baseline="middle" font-style="italic" style="text-anchor: end; dominant-baseline: middle; font-size: 10px; fill:#ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">4</text></g><g class="treemapNode treemapLeafGroup leaf0x" transform="translate(20,70)"><rect width="718" height="310" class="treemapLeaf" fill="hsl(240, 100%, 76.2745098039%)" style="" fill-opacity="0.3" stroke="hsl(240, 100%, 76.2745098039%)" stroke-width="3"></rect><clipPath id="clip-mermaid-svg-0"><rect width="714" height="306"></rect></clipPath><text class="treemapLabel" x="359" y="155" style="text-anchor: middle; dominant-baseline: middle; font-size: 29px; fill: black;" clip-path="url(#clip-mermaid-svg-0)">A leaf with an extremely long name that will never fit</text><text class="treemapValue" x="359" y="171.5" style="text-anchor: middle; dominant-baseline: hanging; font-size: 17px; fill: black;" clip-path="url(#clip-mermaid-svg-0)">3</text></g><g class="treemapNode treemapLeafGroup leaf1x" transform="translate(748,70)"><rect width="232" height="310" class="treemapLeaf" fill="hsl(240, 100%, 76.2745098039%)" style="" fill-opacity="0.3" stroke="hsl(240, 100%, 76.2745098039%)" stroke-width="3"></rect><clipPath id="clip-mermaid-svg-1"><rect width="228" height="306"></rect></clipPath><text class="treemapLabel" x="116" y="155" style="text-anchor: middle; dominant-baseline: middle; font-size: 38px;fill:black;" clip-path="url(#clip-mermaid-svg-1)">C</text><text class="treemapValue" x="116" y="176" style="text-anchor: middle; dominant-baseline: hanging; font-size: 23px; fill: black;