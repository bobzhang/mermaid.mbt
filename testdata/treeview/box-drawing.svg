<svg id="mermaid-svg" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="-0.5 0 149.0625 290" style="max-width: 149.0625px;" role="graphics-document document" aria-roledescription="treeView"><style>#mermaid-svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mermaid-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mermaid-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mermaid-svg .error-icon{fill:#552222;}#mermaid-svg .error-text{fill:#552222;stroke:#552222;}#mermaid-svg .edge-thickness-normal{stroke-width:1px;}#mermaid-svg .edge-thickness-thick{stroke-width:3.5px;}#mermaid-svg .edge-pattern-solid{stroke-dasharray:0;}#mermaid-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#mermaid-svg .edge-pattern-dashed{stroke-dasharray:3;}#mermaid-svg .edge-pattern-dotted{stroke-dasharray:2;}#mermaid-svg .marker{fill:#333333;stroke:#333333;}#mermaid-svg .marker.cross{stroke:#333333;}#mermaid-svg svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#mermaid-svg p{margin:0;}#mermaid-svg .treeView-node-label{font-size:16px;fill:black;white-space:pre;}#mermaid-svg .treeView-node-dir{font-weight:bold;}#mermaid-svg .treeView-node-line{stroke:black;}#mermaid-svg .treeView-node-icon{color:#546e7a;}#mermaid-svg .treeView-node-description{font-size:16px;fill:#6a9955;font-style:italic;white-space:pre;}#mermaid-svg .treeView-highlight-bg{fill:rgba(255, 193, 7, 0.15);stroke:#ffc107;stroke-width:1;}#mermaid-svg .node .neo-node{stroke:#9370DB;}#mermaid-svg [data-look="neo"].node rect,#mermaid-svg [data-look="neo"].cluster rect,#mermaid-svg [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].swimlane.cluster rect{filter:none;}#mermaid-svg [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#mermaid-svg [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#mermaid-svg [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].node circle .state-start{fill:#000000;}#mermaid-svg [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g></g><g class="tree-view"><g><text dominant-baseline="middle" class="treeView-node-label treeView-node-dir" x="5" y="14.5">/</text></g><line x1="-10" y1="14.5" x2="0" y2="14.5" stroke-width="1" class="treeView-node-line"></line><g><text dominant-baseline="middle" class="treeView-node-label treeView-node-dir" x="20" y="43.5">packages</text></g><line x1="5" y1="43.5" x2="15" y2="43.5" stroke-width="1" class="treeView-node-line"></line><g><text dominant-baseline="middle" class="treeView-node-label treeView-node-dir" x="35" y="72.5">mermaid</text></g><line x1="20" y1="72.5" x2="30" y2="72.5" stroke-width="1" class="treeView-node-line"></line><g><text dominant-baseline="middle" class="treeView-node-label treeView-node-dir" x="50" y="101.5">src</text></g><line x1="35" y1="101.5" x2="45" y2="101.5" stroke-width="1" class="treeView-node-line"></line><g><text dominant-baseline="middle" class="treeView-node-label" x="65" y="130.5">parser.ts</text></g><line x1="50" y1="130.5" x2="60" y2="130.5" stroke-width="1" class="treeView-node-line"></line><g><text dominant-baseline="middle" class="treeView-node-label" x="65" y="159.5">renderer.ts</text></g><line x1="50" y1="159.5