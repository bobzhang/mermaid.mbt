<svg id="mermaid-svg" width="100%" xmlns="http://www.w3.org/2000/svg" class="railroad-diagram" style="max-width: 214.453125px;" viewBox="0 0 214.453125 369" role="graphics-document document" aria-roledescription="railroadEbnf"><style>#mermaid-svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mermaid-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mermaid-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mermaid-svg .error-icon{fill:#552222;}#mermaid-svg .error-text{fill:#552222;stroke:#552222;}#mermaid-svg .edge-thickness-normal{stroke-width:1px;}#mermaid-svg .edge-thickness-thick{stroke-width:3.5px;}#mermaid-svg .edge-pattern-solid{stroke-dasharray:0;}#mermaid-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#mermaid-svg .edge-pattern-dashed{stroke-dasharray:3;}#mermaid-svg .edge-pattern-dotted{stroke-dasharray:2;}#mermaid-svg .marker{fill:#333333;stroke:#333333;}#mermaid-svg .marker.cross{stroke:#333333;}#mermaid-svg svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#mermaid-svg p{margin:0;}#mermaid-svg .railroad-diagram{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#mermaid-svg .railroad-terminal rect{fill:#ffffde;stroke:hsl(60, 60%, 83.5294117647%);stroke-width:2px;}#mermaid-svg .railroad-terminal text{fill:#000021;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;text-anchor:middle;dominant-baseline:middle;}#mermaid-svg .railroad-nonterminal rect{fill:#ECECFF;stroke:hsl(240, 60%, 86.2745098039%);stroke-width:2px;}#mermaid-svg .railroad-nonterminal text{fill:#131300;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;text-anchor:middle;dominant-baseline:middle;}#mermaid-svg .rail