<svg id="mermaid-svg" width="100%" xmlns="http://www.w3.org/2000/svg" class="railroad-diagram" style="max-width: 402.203125px;" viewBox="0 0 402.203125 126" role="graphics-document document" aria-roledescription="railroad"><style>#mermaid-svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:13;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mermaid-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mermaid-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mermaid-svg .error-icon{fill:hsl(212, 100%, 55%);}#mermaid-svg .error-text{fill:rgb(229.5, 122.4, 0);stroke:rgb(229.5, 122.4, 0);}#mermaid-svg .edge-thickness-normal{stroke-width:1px;}#mermaid-svg .edge-thickness-thick{stroke-width:3.5px;}#mermaid-svg .edge-pattern-solid{stroke-dasharray:0;}#mermaid-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#mermaid-svg .edge-pattern-dashed{stroke-dasharray:3;}#mermaid-svg .edge-pattern-dotted{stroke-dasharray:2;}#mermaid-svg .marker{fill:#0b0b0b;stroke:#0b0b0b;}#mermaid-svg .marker.cross{stroke:#0b0b0b;}#mermaid-svg svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:13;}#mermaid-svg p{margin:0;}#mermaid-svg .railroad-diagram{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:13px;}#mermaid-svg .railroad-terminal rect{fill:#ffffde;stroke:hsl(-88, 60%, 40%);stroke-width:2px;}#mermaid-svg .railroad-terminal text{fill:rgb(119, 255, 0);font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:13px;text-anchor:middle;dominant-baseline:middle;}#mermaid-svg .railroad-nonterminal rect{fill:#ff8800;stroke:hsl(32, 60%, 40%);stroke-width:2px;}#mermaid-svg .railroad-nonterminal text{fill:#333;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:13px;text-anchor:middle;dominant-baseline:middle;}#mermaid-svg .railroad-line{stroke:#0b0b0b;stroke-width:2px;fill:none;}#mermaid-svg .railroad-start circle,#mermaid-svg .railroad-end circle{fill:#0b0b0b;}#mermaid-svg .railroad-comment ellipse{fill:rgba(232,232,232, 0.8);stroke:hsl(212, 60%, 45%);stroke-width:2px;}#mermaid-svg .railroad-comment text{fill:rgb(229.5, 122.4, 0);font-style:italic;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:13px;text-anchor:middle;dominant-baseline:middle;}#mermaid-svg .railroad-special rect{fill:hsl(212, 100%, 55%);stroke:hsl(212, 60%, 45%);stroke-width:2px;stroke-dasharray:5,3;}#mermaid-svg .railroad-special text{fill:#333;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:13px;text-anchor:middle;dominant-baseline:middle;}#mermaid-svg .railroad-rule-name{font-weight:bold;fill:rgb(229.5, 122.4, 0);font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:13px;}#mermaid-svg .node .neo-node{stroke:hsl(32, 60%, 40%);}#mermaid-svg [data-look="neo"].node rect,#mermaid-svg [data-look="neo"].cluster rect,#mermaid-svg [data-look="neo"].node polygon{stroke:url(#mermaid-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaid-svg [data-look="neo"].swimlane.cluster rect{filter:none;}#mermaid-svg [data-look="neo"].node path{stroke:url(#mermaid-svg-gradient);stroke-width:1px;}#mermaid-svg [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaid-svg [data-look="neo"].node .neo-line path{stroke:hsl(32, 60%, 40%);filter:none;}#mermaid-svg [data-look="neo"].node circle{stroke:url(#mermaid-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaid-svg [data-look="neo"].node circle .state-start{fill:#000000;}#mermaid-svg [data-look="neo"].icon-shape .icon{fill:url(#mermaid-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaid-svg [data-look="neo"].icon-shape .icon-neo path{stroke:url(#mermaid-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaid-svg :ro