<svg id="mermaid-svg" width="100%" xmlns="http://www.w3.org/2000/svg" class="railroad-diagram" style="max-width: 410.484375px;" viewBox="0 0 410.484375 128" role="graphics-document document" aria-roledescription="railroad"><style>#mermaid-svg{font-family:"Recursive Variable",arial,sans-serif;font-size:14px;fill:#ccc;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mermaid-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mermaid-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mermaid-svg .error-icon{fill:hsl(20, 1.5873015873%, 12.3529411765%);}#mermaid-svg .error-text{fill:rgb(222.9999999999, 223.6666666666, 223.9999999999);stroke:rgb(222.9999999999, 223.6666666666, 223.9999999999);}#mermaid-svg .edge-thickness-normal{stroke-width:2px;}#mermaid-svg .edge-thickness-thick{stroke-width:3.5px;}#mermaid-svg .edge-pattern-solid{stroke-dasharray:0;}#mermaid-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#mermaid-svg .edge-pattern-dashed{stroke-dasharray:3;}#mermaid-svg .edge-pattern-dotted{stroke-dasharray:2;}#mermaid-svg .marker{fill:#cccccc;stroke:#cccccc;}#mermaid-svg .marker.cross{stroke:#cccccc;}#mermaid-svg svg{font-family:"Recursive Variable",arial,sans-serif;font-size:14px;}#mermaid-svg p{margin:0;}#mermaid-svg .railroad-diagram{font-family:"Recursive Variable",arial,sans-serif;font-size:14px;}#mermaid-svg .railroad-terminal rect{fill:hsl(240, 5.5555555556%, 23.0588235294%);stroke:hsl(180, 0%, 18.3529411765%);stroke-width:2px;}#mermaid-svg .railroad-terminal text{fill:rgb(183.8476190475, 181.5523809523, 181.5523809523);font-family:"Recursive Variable",arial,sans-serif;font-size:14px;text-anchor:middle;dominant-baseline:middle;}#mermaid-svg .railroad-nonterminal rect{fill:#111113;stroke:#cccccc;stroke-width:2px;}#mermaid-svg .railroad