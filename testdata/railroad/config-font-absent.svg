<svg id="mermaid-svg" width="100%" xmlns="http://www.w3.org/2000/svg" class="railroad-diagram" style="max-width: 305px;" viewBox="0 0 305 108" role="graphics-document document" aria-roledescription="railroad"><style>#mermaid-svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mermaid-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mermaid-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mermaid-svg .error-icon{fill:#552222;}#mermaid-svg .error-text{fill:#552222;stroke:#552222;}#mermaid-svg .edge-thickness-normal{stroke-width:1px;}#mermaid-svg .edge-thickness-thick{stroke-width:3.5px;}#mermaid-svg .edge-pattern-solid{stroke-dasharray:0;}#mermaid-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#mermaid-svg .edge-pattern-dashed{stroke-dasharray:3;}#mermaid-svg .edge-pattern-dotted{stroke-dasharray:2;}#mermaid-svg .marker{fill:#333333;stroke:#333333;}#mermaid-svg .marker.cross{stroke:#333333;}#mermaid-svg svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#mermaid-svg p{margin:0;}#mermaid-svg .railroad-diagram{font-family:Open Sans;font-size:0px;}#mermaid-svg .railroad-terminal rect{fill:#ffffde;stroke:hsl(60, 60%, 83.5294117647%);stroke-width:2px;}#mermaid-svg .railroad-terminal text{fill:#000021;font-family:Open Sans;font-size:0px;text-anchor:middle;dominant-baseline:middle;}#mermaid-svg .railroad-nonterminal rect{fill:#ECECFF;stroke:hsl(240, 60%, 86.2745098039%);stroke-width:2px;}#mermaid-svg .railroad-nonterminal text{fill:#131300;font-family:Open Sans;font-size:0px;text-anchor:middle;dominant-baseline:middle;}#mermaid-svg .railroad-line{stroke:#333333;stroke-width:2px;fill:none;}#mermaid-svg .railroad-start circle,#mermaid-svg .railroad-end circle{fill:#333333;}#mermaid-svg .railroad-comment ellipse{fill:rgba(232,232,232, 0.8);stroke:hsl(80, 60%, 86.2745098039%);stroke-width:2px;}#mermaid-svg .railroad-comment text{fill:rgb(6.3333333334, 0, 19.0000000001);font-style:italic;font-family:Open Sans;font-size:0px;text-anchor:middle;dominant-baseline:middle;}#mermaid-svg .railroad-special rect{fill:hsl(80, 100%, 96.2745098039%);stroke:hsl(80, 60%, 86.2745098039%);stroke-width:2px;stroke-dasharray:5,3;}#mermaid-svg .railroad-special text{fill:#131300;font-family:Open Sans;font-size:0px;text-anchor:middle;dominant-baseline:middle;}#mermaid-svg .railroad-rule-name{font-weight:bold;fill:#333;font-family:Open Sans;font-size:0px;}#mermaid-svg .node .neo-node{stroke:#9370DB;}#mermaid-svg [data-look="neo"].node rect,#mermaid-svg [data-look="neo"].cluster rect,#mermaid-svg [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].swimlane.cluster rect{filter:none;}#mermaid-svg [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#mermaid-svg [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#mermaid-svg [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].node circle .state-start{fill:#000000;}#mermaid-svg [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g></g><g class="railroad-rule" transform="translate(0, 10)"><g transform="translate(40, 0)"><g class="railroad-sequence"><g class="railroad-terminal" transform="translate(0, 20)"><rect x="0" y="0" width="20" height="20" rx="10" ry="10"></rect><text x="10" y="10">lit</text></g><path class="railroad-line" d="M 20 30 L 30 30"></path><g class="railroad-choice" transform="translate(30, 6)"><g class="railroad-nonterminal" transform="translate(20, 0)"><rect x="0" y="0" width="20" height="20"></rect><text x="10" y="10">name</text></g><path class="railroad-line" d="M 0 24 A 10 10 0 0 0 10 14 L 10 20 A 10 10 0 0 1 20 10 L 20 10"></path><path class="railroad-line" d="M 40 10 L 40 10 A 10 10 0 0 1 50 20 L 50 14 A 10 10 0 0 0 60 24"></path><g class="railroad-special" transform="translate(20, 28)"><rect x="0" y="0" width="20" height="20"></rect><text x="10" y="10">? any ?</text></g><path class="railroad-line" d="M 0 24 A 10 10 0 0 1 10 34 L 10 28 A 10 10 0 0 0 20 38 L 20 38"></path><path class="railroad-line" d="M 40 38 L 40 38 A 10 10 0 0 0 50 28 L 50 34 A 10 10 0 0 1 60 24"></path></g><path class="railroad-line" d="M 90 30 L 100 30"></path><g class="railroad-optional" transform="translate(100, 0)"><g class="railroad-terminal" transform="translate(20, 20)"><rect x="0" y="0" width="20" height="20" rx="10" ry="10"></rect><text x="10" y="10">x</text></g><path class="railroad-line" d="M 0 30 L 20 30"></path><path class="railroad-line" d="M 40 30 L 60 30"></path><path class="railroad-line" d="M 0 30 A 10 10 0 0 0 10 20 L 10 10 A 10 10 0 0 1 20 0 L 40 0 A 10 10 0 0 1 50 10 L 50 20 A 10 10 0 0 0 60 30"></path></g><path class="railroad-line" d="M 160 30 L 170 30"></path><g class="railroad-repetition" transform="translate(170, 0)"><g class="railroad-nonterminal" transform="translate(20, 20)"><rect x="0" y="0" width="20" height="20"></rect><text x="10" y="10">y</text></g><path class="railroad-line" d="M 0 30 L 20 30"></path><path class="railroad-line" d="M 40 30 L 60 30"></path><path class="railroad-line" d="M 40 30 A 10 10 0 0 1 50 40 L 50 50 A 10 10 0 0 1 40 60 L 20 60 A 10 10 0 0 1 10 50 L 10 40 A 10 10 0 0 1 20 30"></path><path class="railroad-line" d="M 0 30 A 10 10 0 0 0 10 20 L 10 10 A 10 10 0 0 1 20 0 L 40 0 A 10 10 0 0 1 50 10 L 50 20 A 10 10 0 0 0 60 30"></path></g></g></g><g class="railroad-rule-name-group"><text class="railroad-rule-name" x="0" y="30">rule =</text></g><g class="railroad-start"><circle cx="20" cy="30" r="5"></circle></g><g class="railroad-end"><circle cx="280" cy="30" r="5"></circle></g><path class="railroad-line" d="M 25 30 L 40 30"></path><path class="railroad-line" d="M 270 30 L 275 30"></path></g></svg>