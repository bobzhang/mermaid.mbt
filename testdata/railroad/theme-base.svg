<svg id="mermaid-svg" width="100%" xmlns="http://www.w3.org/2000/svg" class="railroad-diagram" style="max-width: 424.59375px;" viewBox="0 0 424.59375 134" role="graphics-document document" aria-roledescription="railroad"><style>#mermaid-svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mermaid-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mermaid-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mermaid-svg .error-icon{fill:hsl(220.5882352941, 100%, 98.3333333333%);}#mermaid-svg .error-text{fill:rgb(8.5000000002, 5.7500000001, 0);stroke:rgb(8.5000000002, 5.7500000001, 0);}#mermaid-svg .edge-thickness-normal{stroke-width:1px;}#mermaid-svg .edge-thickness-thick{stroke-width:3.5px;}#mermaid-svg .edge-pattern-solid{stroke-dasharray:0;}#mermaid-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#mermaid-svg .edge-pattern-dashed{stroke-dasharray:3;}#mermaid-svg .edge-pattern-dotted{stroke-dasharray:2;}#mermaid-svg .marker{fill:#0b0b0b;stroke:#0b0b0b;}#mermaid-svg .marker.cross{stroke:#0b0b0b;}#mermaid-svg svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#mermaid-svg p{margin:0;}#mermaid-svg .railroad-diagram{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#mermaid-svg .railroad-terminal rect{fill:#ffffde;stroke:hsl(-79.4117647059, 60%, 83.3333333333%);stroke-width:2px;}#mermaid-svg .railroad-terminal text{fill:rgb(11.0000000001, 34.0000000002, 0);font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;text-anchor:middle;dominant-baseline:middle;}#mermaid-svg .railroad-nonterminal rect{fill:#fff4dd;stroke:hsl(40.5882352941, 60%, 83.3333333333%);stroke-width:2px;}#mermaid-svg .railroad-nonterminal text{fill:#333;