ss="railroad-rule" transform="translate(0, 10)"><g transform="translate(61.625, 0)"><g class="railroad-choice"><g class="railroad-terminal" transform="translate(20, 0)"><rect x="0" y="0" width="42.140625" height="39" rx="10" ry="10"></rect><text x="21.0703125" y="19.5">a&nbsp;b</text></g><path class="railroad-line" d="M 0 43 A 10 10 0 0 0 10 33 L 10 29.5 A 10 10 0 0 1 20 19.5 L 20 19.5"></path><path class="railroad-line" d="M 62.140625 19.5 L 62.140625 19.5 A 10 10 0 0 1 72.140625 29.5 L 72.140625 33 A 10 10 0 0 0 82.140625 43"></path><g class="railroad-terminal" transform="translate(28.65625, 47)"><rect x="0" y="0" width="24.828125" height="39" rx="10" ry="10"></rect><text x="12.4140625" y="19.5">&nbsp;</text></g><path class="railroad-line" d="M 0 43 A 10 10 0 0 1 10 53 L 10 56.5 A 10 10 0 0 0 20 66.5 L 28.65625 66.5"></path><path class="railroad-line" d="M 53.484375 66.5 L 62.140625 66.5 A 10 10 0 0 0 72.140625 56.5 L 72.140625 53 A 10 10 0 0 1 82.140625 43"></path></g></g><g class="railroad-rule-name-group"><text class="railroad-rule-name" x="0" y="43">a =</text></g><g class="railroad-start"><circle cx="41.625" cy="43" r="5"></circle></g><g class="railroad-end"><circle cx="153.765625" cy="43" r="5"></circle></g><path class="railroad-line" d="M 46.625 43 L 61.625 43"></path><path class="railroad-line" d="M 143.765625 43 L 148.765625 43"></path></g></svg>