<svg id="mermaid-svg" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 100" style="max-width: 740px;" role="graphics-document document" aria-roledescription="gantt"><style>#mermaid-svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mermaid-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mermaid-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mermaid-svg .error-icon{fill:#552222;}#mermaid-svg .error-text{fill:#552222;stroke:#552222;}#mermaid-svg .edge-thickness-normal{stroke-width:1px;}#mermaid-svg .edge-thickness-thick{stroke-width:3.5px;}#mermaid-svg .edge-pattern-solid{stroke-dasharray:0;}#mermaid-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#mermaid-svg .edge-pattern-dashed{stroke-dasharray:3;}#mermaid-svg .edge-pattern-dotted{stroke-dasharray:2;}#mermaid-svg .marker{fill:#333333;stroke:#333333;}#mermaid-svg .marker.cross{stroke:#333333;}#mermaid-svg svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#mermaid-svg p{margin:0;}#mermaid-svg .mermaid-main-font{font-family:"trebuchet ms",verdana,arial,sans-serif;}#mermaid-svg .exclude-range{fill:#eeeeee;}#mermaid-svg .section{stroke:none;opacity:0.2;}#mermaid-svg .section0{fill:rgba(102, 102, 255, 0.49);}#mermaid-svg .section2{fill:#fff400;}#mermaid-svg .section1,#mermaid-svg .section3{fill:white;opacity:0.2;}#mermaid-svg .sectionTitle0{fill:#333;}#mermaid-svg .sectionTitle1{fill:#333;}#mermaid-svg .sectionTitle2{fill:#333;}#mermaid-svg .sectionTitle3{fill:#333;}#mermaid-svg .sectionTitle{text-anchor:start;font-family:"trebuchet ms",verdana,arial,sans-serif;}#mermaid-svg .grid .tick{stroke:lightgrey;opacity:0.8;shape-rendering:crispEdges;}#mermaid-svg .grid .tick text{font-family:"trebuchet ms",verdana,arial,sans-serif;fill:#333;}#mermaid-svg .grid path{stroke-width:0;}#mermaid-svg .today{fill:none;stroke:red;stroke-width:2px;}#mermaid-svg .task{stroke-width:2;}#mermaid-svg .taskText{text-anchor:middle;font-family:"trebuchet ms",verdana,arial,sans-serif;}#mermaid-svg .taskTextOutsideRight{fill:black;text-anchor:start;font-family:"trebuchet ms",verdana,arial,sans-serif;}#mermaid-svg .taskTextOutsideLeft{fill:black;text-anchor:end;}#mermaid-svg .task.clickable{cursor:pointer;}#mermaid-svg .taskText.clickable{cursor:pointer;fill:#003163!important;font-weight:bold;}#mermaid-svg .taskTextOutsideLeft.clickable{cursor:pointer;fill:#003163!important;font-weight:bold;}#mermaid-svg .taskTextOutsideRight.clickable{cursor:pointer;fill:#003163!important;font-weight:bold;}#mermaid-svg .taskText0,#mermaid-svg .taskText1,#mermaid-svg .taskText2,#mermaid-svg .taskText3{fill:white;}#mermaid-svg .task0,#mermaid-svg .task1,#mermaid-svg .task2,#mermaid-svg .task3{fill:#8a90dd;stroke:#534fbc;}#mermaid-svg .taskTextOutside0,#mermaid-svg .taskTextOutside2{fill:black;}#mermaid-svg .taskTextOutside1,#mermaid-svg .taskTextOutside3{fill:black;}#mermaid-svg .active0,#mermaid-svg .active1,#mermaid-svg .active2,#mermaid-svg .active3{fill:#bfc7ff;stroke:#534fbc;}#mermaid-svg .activeText0,#mermaid-svg .activeText1,#mermaid-svg .activeText2,#mermaid-svg .activeText3{fill:black!important;}#mermaid-svg .done0,#mermaid-svg .done1,#mermaid-svg .done2,#mermaid-svg .done3{stroke:grey;fill:lightgrey;stroke-width:2;}#mermaid-svg .doneText0,#mermaid-svg .doneText1,#mermaid-svg .doneText2,#mermaid-svg .doneText3{fill:black!important;}#mermaid-svg .doneText0.taskTextOutsideLeft,#mermaid-svg .doneText0.taskTextOutsideRight,#mermaid-svg .doneText1.taskTextOutsideLeft,#mermaid-svg .doneText1.taskTextOutsideRight,#mermaid-svg .doneText2.taskTextOutsideLeft,#mermaid-svg .doneText2.taskTextOutsideRight,#mermaid-svg .doneText3.taskTextOutsideLeft,#mermaid-svg .doneText3.taskTextOutsideRight{fill:black!important;}#mermaid-svg .crit0,#mermaid-svg .crit1,#mermaid-svg .crit2,#mermaid-svg .crit3{stroke:#ff8888;fill:red;stroke-width:2;}#mermaid-svg .activeCrit0,#mermaid-svg .activeCrit1,#mermaid-svg .activeCrit2,#mermaid-svg .activeCrit3{stroke:#ff8888;fill:#bfc7ff;stroke-width:2;}#mermaid-svg .doneCrit0,#mermaid-svg .doneCrit1,#mermaid-svg .doneCrit2,#mermaid-svg .doneCrit3{stroke:#ff8888;fill:lightgrey;stroke-width:2;cursor:pointer;shape-rendering:crispEdges;}#mermaid-svg .milestone{transform:rotate(45deg) scale(0.8,0.8);}#mermaid-svg .milestoneText{font-style:italic;}#mermaid-svg .doneCritText0,#mermaid-svg .doneCritText1,#mermaid-svg .doneCritText2,#mermaid-svg .doneCritText3{fill:black!important;}#mermaid-svg .doneCritText0.taskTextOutsideLeft,#mermaid-svg .doneCritText0.taskTextOutsideRight,#mermaid-svg .doneCritText1.taskTextOutsideLeft,#mermaid-svg .doneCritText1.taskTextOutsideRight,#mermaid-svg .doneCritText2.taskTextOutsideLeft,#mermaid-svg .doneCritText2.taskTextOutsideRight,#mermaid-svg .doneCritText3.taskTextOutsideLeft,#mermaid-svg .doneCritText3.taskTextOutsideRight{fill:black!important;}#mermaid-svg .vert{stroke:navy;}#mermaid-svg .vertText{font-size:15px;text-anchor:middle;fill:navy!important;}#mermaid-svg .activeCritText0,#mermaid-svg .activeCritText1,#mermaid-svg .activeCritText2,#mermaid-svg .activeCritText3{fill:black!important;}#mermaid-svg .titleText{text-anchor:middle;font-size:18px;fill:#333;font-family:"trebuchet ms",verdana,arial,sans-serif;}#mermaid-svg .node .neo-node{stroke:#9370DB;}#mermaid-svg [data-look="neo"].node rect,#mermaid-svg [data-look="neo"].cluster rect,#mermaid-svg [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].swimlane.cluster rect{filter:none;}#mermaid-svg [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#mermaid-svg [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1))