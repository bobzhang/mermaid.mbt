<svg id="mermaid-svg" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 700px;" viewBox="0 0 700 500" role="graphics-document document" aria-roledescription="xychart"><style>#mermaid-svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mermaid-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mermaid-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mermaid-svg .error-icon{fill:#552222;}#mermaid-svg .error-text{fill:#552222;stroke:#552222;}#mermaid-svg .edge-thickness-normal{stroke-width:1px;}#mermaid-svg .edge-thickness-thick{stroke-width:3.5px;}#mermaid-svg .edge-pattern-solid{stroke-dasharray:0;}#mermaid-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#mermaid-svg .edge-pattern-dashed{stroke-dasharray:3;}#mermaid-svg .edge-pattern-dotted{stroke-dasharray:2;}#mermaid-svg .marker{fill:#333333;stroke:#333333;}#mermaid-svg .marker.cross{stroke:#333333;}#mermaid-svg svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#mermaid-svg p{margin:0;}#mermaid-svg .node .neo-node{stroke:#9370DB;}#mermaid-svg [data-look="neo"].node rect,#mermaid-svg [data-look="neo"].cluster rect,#mermaid-svg [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].swimlane.cluster rect{filter:none;}#mermaid-svg [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#mermaid-svg [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#mermaid-svg [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].node circle .state-start{fill:#000000;}#mermaid-svg [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g></g><g class="main"><rect width="700" height="500" class="background" fill="white"></rect><g class="chart-title"><text x="0" y="0" fill="#131300" font-size="20" dominant-baseline="middle" text-anchor="middle" transform="translate(360.4640634536743, 21.55078125) rotate(0)">Configured chart</text></g><g class="plot"><g class="bar-plot-0"><rect x="84.31875190734863" y="389.5859358651298" width="60.8" height="64.41406222752158" fill="#ECECFF" stroke="#ECECFF" stroke-width="0"></rect><rect x="182.6168765258789" y="333.17187363760814" width="60.8" height="120.82812445504322" fill="#ECECFF" stroke="#ECECFF" stroke-width="0"></rect><rect x="280.9150011444092" y="248.55078029632568" width="60.8" height="205.44921779632568" fill="#ECECFF" stroke="#ECECFF" stroke-width="0"></rect><rect x="379.2131257629395" y="209.06093673706056" width="60.8" height="244.9390613555908" fill="#ECECFF" stroke="#ECECFF" stroke-width="0"></rect><rect x="477.5112503814698" y="135.72265584128246" width="60.8" height="318.2773422513689" fill="#ECECFF" stroke="#ECECFF" stroke-width="0"></rect><rect x="575.809375" y="79.3085936137608" width="60.8" height="374.69140447889055" fill="#ECECFF" stroke="#ECECFF" stroke-width="0"></rect></g><g class="line-plot-1"><path d="M114.719,389.586L213.017,333.172L311.315,248.551L409.613,209.061L507.911,135.723L606.209,79.309" fill="none" stroke="#8493A6" stroke-width="2"></path></g></g><g class="legend"><g class="markers"><rect x="648.209375" y="231.05078029632568" width="10.5" height="10.5" fill="#ECECFF" stroke="#ECECFF" stroke-width="0"></rect><path d="M 648.209375,257.3007802963257