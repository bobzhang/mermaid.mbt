<svg id="mermaid-svg" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 700px;" viewBox="0 0 700 500" role="graphics-document document" aria-roledescription="xychart"><style>#mermaid-svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mermaid-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mermaid-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mermaid-svg .error-icon{fill:#552222;}#mermaid-svg .error-text{fill:#552222;stroke:#552222;}#mermaid-svg .edge-thickness-normal{stroke-width:1px;}#mermaid-svg .edge-thickness-thick{stroke-width:3.5px;}#mermaid-svg .edge-pattern-solid{stroke-dasharray:0;}#mermaid-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#mermaid-svg .edge-pattern-dashed{stroke-dasharray:3;}#mermaid-svg .edge-pattern-dotted{stroke-dasharray:2;}#mermaid-svg .marker{fill:#333333;stroke:#333333;}#mermaid-svg .marker.cross{stroke:#333333;}#mermaid-svg svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#mermaid-svg p{margin:0;}#mermaid-svg .node .neo-node{stroke:#9370DB;}#mermaid-svg [data-look="neo"].node rect,#mermaid-svg [data-look="neo"].cluster rect,#mermaid-svg [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].swimlane.cluster rect{filter:none;}#mermaid-svg [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#mermaid-svg [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#mermaid-svg [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].node circle .state-start{fill:#000000;}#mermaid-svg [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g></g><g class="main"><rect width="700" height="500" class="background" fill="white"></rect><g class="chart-title"><text x="0" y="0" fill="#131300" font-size="20" dominant-baseline="middle" text-anchor="middle" transform="translate(368.8078134536743, 21.55078125) rotate(0)">Configured chart</text></g><g class="plot"><g class="bar-plot-0"><rect x="99.40625190734863" y="44.3515625" width="76.97187472752165" height="47.5" fill="#ECECFF" stroke="#ECECFF" stroke-width="0"></rect><rect x="99.40625190734863" y="125.73124999999999" width="153.94374945504325" height="47.5" fill="#ECECFF" stroke="#ECECFF" stroke-width="0"></rect><rect x="99.40625190734863" y="207.1109375" width="269.4015615463257" height="47.5" fill="#ECECFF" stroke="#ECECFF" stroke-width="0"></rect><rect x="99.40625190734863" y="288.490625" width="323.28187385559085" height="47.5" fill="#ECECFF" stroke="#ECECFF" stroke-width="0"></rect><rect x="99.40625190734863" y="369.8703125" width="423.34531100136894" height="47.5" fill="#ECECFF" stroke="#ECECFF" stroke-width="0"></rect><rect x="99.40625190734863" y="451.25" width="500.31718572889054" height="47.5" fill="#ECECFF" stroke="#ECECFF" stroke-width="0"></rect></g><g class="line-plot-1"><path d="M176.378,68.102L253.35,149.481L368.808,230.861L422.688,312.241L522.752,393.62L599.723,475" fill="none" stroke="#8493A6" stroke-width="2"></path></g></g><g class="legend"><g class="markers"><rect x="648.209375" y="254.05078125" width="10.5" height="10.5" fill="#ECECFF" stroke="#ECECFF" stroke-width="0"></rect><path d="M 648.209375,280.30078125 L 658.709375,280.30078125" fill="none" stroke="