<svg id="mermaid-svg" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 546.96875 450" style="max-width: 546.96875px;" role="graphics-document document" aria-roledescription="pie"><style>#mermaid-svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#000000;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mermaid-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mermaid-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mermaid-svg .error-icon{fill:#552222;}#mermaid-svg .error-text{fill:#552222;stroke:#552222;}#mermaid-svg .edge-thickness-normal{stroke-width:1px;}#mermaid-svg .edge-thickness-thick{stroke-width:3.5px;}#mermaid-svg .edge-pattern-solid{stroke-dasharray:0;}#mermaid-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#mermaid-svg .edge-pattern-dashed{stroke-dasharray:3;}#mermaid-svg .edge-pattern-dotted{stroke-dasharray:2;}#mermaid-svg .marker{fill:#666;stroke:#666;}#mermaid-svg .marker.cross{stroke:#666;}#mermaid-svg svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#mermaid-svg p{margin:0;}#mermaid-svg .pieCircle{stroke:black;stroke-width:2px;opacity:0.7;}#mermaid-svg .pieCircle.highlighted{scale:1.05;opacity:1;}#mermaid-svg .pieCircle.highlightedOnHover:hover{transition-duration:250ms;scale:1.05;opacity:1;}#mermaid-svg .pieOuterCircle{stroke:black;stroke-width:2px;fill:none;}#mermaid-svg .pieTitleText{text-anchor:middle;font-size:25px;fill:#333;font-family:"trebuchet ms",verdana,arial,sans-serif;}#mermaid-svg .slice{font-family:"trebuchet ms",verdana,arial,sans-serif;fill:#000000;font-size:17px;}#mermaid-svg .legend text{fill:#333;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:17px;}#mermaid-svg .node .neo-node{stroke:#999;}#mermaid-svg [data-look="neo"].node rect,#mermaid-svg [data-look="neo"].cluster rect,#mermaid-svg [data-look="neo"].node polygon{stroke:url(#mermaid-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaid-svg [data-look="neo"].swimlane.cluster rect{filter:none;}#mermaid-svg [data-look="neo"].node path{stroke:url(#mermaid-svg-gradient);stroke-width:1px;}#mermaid-svg [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaid-svg [data-look="neo"].node .neo-line path{stroke:#999;filter:none;}#mermaid-svg [data-look="neo"].node circle{stroke:url(#mermaid-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaid-svg [data-look="neo"].node circle .state-start{fill:#000000;}#mermaid-svg [data-look="neo"].icon-shape .icon{fill:url(#mermaid-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaid-svg [data-look="neo"].icon-shape .icon-neo path{stroke:url(#mermaid-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaid-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g></g><g transform="translate(225,225)"><g><circle cx="0" cy="0" r="186" class="pieOuterCircle"></circle><path d="M0,-185A185,185,0,1,1,-184.047,18.752L0,0Z" fill="#F4F4F4" class="pieCircle"></path><path d="M-184.047,18.752A185,185,0,0,1,-112.986,-146.49L0,0Z" fill="#555" class="pieCircle"></path><path d="M-112.986,-146.49A185,185,0,0,1,-85.069,-164.281L0,0Z" fill="#BBB" class="pieCircle"></path><path d="M-85.069,-164.281A185,185,0,0,1,0,-185L0,0Z" fill="#777" class="pieCircle"></path><text transform="translate(102.96334494941237,93.00597882302147)" class="slice" style="text-anchor: middle;">73%</text><text transform="translate(-127.46319043401425,-54.81512185868255)" class="slice" style="text-anchor: middle;">16%</text><text transform="translate(-74.5697340248074,-117.00819316385278)" class="slice" style="text-anchor: middle;">3%</text><text transform="translate(-32.83356007934356,-134.80919787802364)" class="slice" style="text-anchor: middle;">8%</text></g><text x="0" y="-200" class="pieTitleText">Neutral theme</text><g class="legend" transform="translate(216,-44)"><rect width="18" height="18" style="fill: rgb(244, 244, 244); stroke: rgb(244, 244, 244);"></rect><text x="22" y="14">Dogs</text></g><g class="legend" transform="translate(216,-22)"><rect width="18" height="18" style="fill: rgb(85, 85, 85); stroke: rgb(85, 85, 85);"></rect><text x="22" y="14">Cats</text></g><g class="legend" transform="translate(216,0)"><rect width="18" height="18" style="fill: rgb(187, 187, 187); stroke: rgb(187, 187, 187);"></rect><text x="22" y="14">Rats</text></g><g class="legend" transform="translate(216,22)"><rect width="18" height="18" style="fill: rgb(119, 119, 119); stroke: rgb(119, 119, 119);"></rect><text x="22" y="14">Fish</text></g></g></svg>