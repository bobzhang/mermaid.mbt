<svg id="mermaid-svg" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 82 188" style="max-width: 82px;" role="graphics-document document" aria-roledescription="packet"><style>#mermaid-svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mermaid-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mermaid-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mermaid-svg .error-icon{fill:#552222;}#mermaid-svg .error-text{fill:#552222;stroke:#552222;}#mermaid-svg .edge-thickness-normal{stroke-width:1px;}#mermaid-svg .edge-thickness-thick{stroke-width:3.5px;}#mermaid-svg .edge-pattern-solid{stroke-dasharray:0;}#mermaid-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#mermaid-svg .edge-pattern-dashed{stroke-dasharray:3;}#mermaid-svg .edge-pattern-dotted{stroke-dasharray:2;}#mermaid-svg .marker{fill:#333333;stroke:#333333;}#mermaid-svg .marker.cross{stroke:#333333;}#mermaid-svg svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#mermaid-svg p{margin:0;}#mermaid-svg .packetByte{font-size:10px;}#mermaid-svg .packetByte.start{fill:black;}#mermaid-svg .packetByte.end{fill:black;}#mermaid-svg .packetLabel{fill:black;font-size:12px;}#mermaid-svg .packetTitle{fill:black;font-size:14px;}#mermaid-svg .packetBlock{stroke:black;stroke-width:1;fill:#efefef;}#mermaid-svg .node .neo-node{stroke:#9370DB;}#mermaid-svg [data-look="neo"].node rect,#mermaid-svg [data-look="neo"].cluster rect,#mermaid-svg [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].swimlane.cluster rect{filter:none;}#mermaid-svg [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#mermaid-svg [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#mermaid-svg [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].node circle .state-start{fill:#000000;}#mermaid-svg [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g></g><g><rect x="1" y="15" width="75" height="32" class="packetBlock"></rect><text x="38.5" y="31" class="packetLabel" dominant-baseline="middle" text-anchor="middle">A</text><text x="1" y="13" class="packetByte start" dominant-baseline="auto" text-anchor="start">0</text><text x="76" y="13" class="packetByte end" dominant-baseline="auto" text-anchor="end">1.5</text></g><g><rect x="1" y="62" width="43" height="32" class="packetBlock"></rect><text x="22.5" y="78" class="packetLabel" dominant-baseline="middle" text-anchor="middle">A</text><text x="1" y="60" class="packetByte start" dominant-baseline="auto" text-anchor="start">2.5</text><text x="44" y="60" class="packetByte end" dominant-baseline="auto" text-anchor="end">3</text><rect x="49" y="62" width="27" height="32" class="packetBlock"></rect><text x="62.5" y="78" class="packetLabel" dominant-baseline="middle" text-anchor="middle">B</text><text x="62.5" y="60" class="packetByte start" dominant-baseline="auto" text-anchor="middle">4</text></g><g><rect x="1" y="109" width="59" height="32" class="packetBlock"></rect><text x="30.5" y="125" class="packetLabel" dominant-baseline="middle" text-anchor="middle">B</text><text x="1" y="107" class="packetByte start" dominant-baseline="auto" text-anchor="start">5</text><text x="60" y="107" class="packetByte end" dominant-baseline="auto" text-anchor="end">6</text></g><text x="41" y="164.5" dominant-baseline="middle" text-anchor="middle" class="packetTitle">Fractional rows</text></svg>