<svg id="mermaid-svg" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1026 94" style="max-width: 1026px;" role="graphics-document document" aria-roledescription="packet"><style>#mermaid-svg{font-family:"Recursive Variable",arial,sans-serif;font-size:14px;fill:#28253D;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mermaid-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mermaid-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mermaid-svg .error-icon{fill:#ffffff;}#mermaid-svg .error-text{fill:#000000;stroke:#000000;}#mermaid-svg .edge-thickness-normal{stroke-width:2px;}#mermaid-svg .edge-thickness-thick{stroke-width:3.5px;}#mermaid-svg .edge-pattern-solid{stroke-dasharray:0;}#mermaid-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#mermaid-svg .edge-pattern-dashed{stroke-dasharray:3;}#mermaid-svg .edge-pattern-dotted{stroke-dasharray:2;}#mermaid-svg .marker{fill:#000000;stroke:#000000;}#mermaid-svg .marker.cross{stroke:#000000;}#mermaid-svg svg{font-family:"Recursive Variable",arial,sans-serif;font-size:14px;}#mermaid-svg p{margin:0;}#mermaid-svg .packetByte{font-size:10px;}#mermaid-svg .packetByte.start{fill:black;}#mermaid-svg .packetByte.end{fill:black;}#mermaid-svg .packetLabel{fill:black;font-size:12px;}#mermaid-svg .packetTitle{fill:black;font-size:14px;}#mermaid-svg .packetBlock{stroke:black;stroke-width:1;fill:#efefef;}#mermaid-svg .node .neo-node{stroke:#28253D;}#mermaid-svg [data-look="neo"].node rect,#mermaid-svg [data-look="neo"].cluster rect,#mermaid-svg [data-look="neo"].node polygon{stroke:#28253D;filter:url(#mermaid-svg-drop-shadow);}#mermaid-svg [data-look="neo"].swimlane.cluster rect{filter:none;}#mermaid-svg [data-look="neo"].node path{stroke:#28253D;stroke-width:2px;}#mermaid-svg [data-look="neo"].node .outer-path{filter:url(#mermaid-svg-drop-shadow);}#mermaid-svg [data-look="neo"].node .neo-line path{stroke:#28253D;filter:none;}#mermaid-svg [data-look="neo"].node circle{stroke:#28253D;filter:url(#mermaid-svg-drop-shadow);}#mermaid-svg [data-look="neo"].node circle .state-start{fill:#000000;}#mermaid-svg [data-look="neo"].icon-shape .icon{fill:#28253D;filter:url(#mermaid-svg-drop-shadow);}#mermaid-svg [data-look="neo"].icon-shape .icon-neo path{stroke:#28253D;filter:url(#mermaid-svg-drop-shadow);}#mermaid-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g></g><g><rect x="1" y="15" width="507" height="32" class="packetBlock"></rect><text x="254.5" y="31" class="packetLabel" dominant-baseline="middle" text-anchor="middle">a</text><text x="1" y="13" class="packetByte start" dominant-baseline="auto" text-anchor="start">0</text><text x="508" y="13" class="packetByte end" dominant-baseline="auto" text-anchor="end">15</text><rect x="513" y="15" width="507" height="32" class="packetBlock"></rect><text x="766.5" y="31" class="packetLabel" dominant-baseline="middle" text-anchor="middle">b</text><text x="513" y="13" class="packetByte start" dominant-baseline="auto" text-anchor="start">16</text><text x="1020" y="13" class="packetByte end" dominant-baseline="auto" text-anchor="end">31</text></g><text x="513" y="70.5" dominant-baseline="middle" text-anchor="middle" class="packetTitle">Redux</text></svg>