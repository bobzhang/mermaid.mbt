<svg id="mermaid-svg" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 258 141" style="max-width: 258px;" role="graphics-document document" aria-roledescription="packet"><style>#mermaid-svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mermaid-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mermaid-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mermaid-svg .error-icon{fill:#552222;}#mermaid-svg .error-text{fill:#552222;stroke:#552222;}#mermaid-svg .edge-thickness-normal{stroke-width:1px;}#mermaid-svg .edge-thickness-thick{stroke-width:3.5px;}#mermaid-svg .edge-pattern-solid{stroke-dasharray:0;}#mermaid-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#mermaid-svg .edge-pattern-dashed{stroke-dasharray:3;}#mermaid-svg .edge-pattern-dotted{stroke-dasharray:2;}#mermaid-svg .marker{fill:#333333;stroke:#333333;}#mermaid-svg .marker.cross{stroke:#333333;}#mermaid-svg svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#mermaid-svg p{margin:0;}#mermaid-svg .packetByte{font-size:10px;}#mermaid-svg .packetByte.start{fill:black;}#mermaid-svg .packetByte.end{fill:black;}#mermaid-svg .packetLabel{fill:black;font-size:12px;}#mermaid-svg .packetTitle{fill:black;font-size:14px;}#mermaid-svg .packetBlock{stroke:black;stroke-width:1;fill:#efefef;}#mermaid-svg .node .neo-node{stroke:#9370DB;}#mermaid-svg [data-look="neo"].node rect,#mermaid-svg [data-look="neo"].cluster rect,#mermaid-svg [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].swimlane.cluster rect{filter:none;}#mermaid-svg [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#mermaid-svg [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#mermaid-svg [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].node circle .state-start{fill:#000000;}#mermaid-svg [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g></g><g><rect x="129" y="15" width="123" height="32" class="packetBlock"></rect><text x="190.5" y="31" class="packetLabel" dominant-baseline="middle" text-anchor="middle">low</text><text x="129" y="13" class="packetByte start" dominant-baseline="auto" text-anchor="start">3</text><text x="252" y="13" class="packetByte end" dominant-baseline="auto" text-anchor="end">0</text><rect x="97" y="15" width="27" height="32" class="packetBlock"></rect><text x="110.5" y="31" class="packetLabel" dominant-baseline="middle" text-anchor="middle">E</text><text x="110.5" y="13" class="packetByte start" dominant-baseline="auto" text-anchor="middle">4</text><rect x="1" y="15" width="91" height="32" class="packetBlock"></rect><text x="46.5" y="31" class="packetLabel" dominant-baseline="middle" text-anchor="middle">high</text><text x="1" y="13" class="packetByte start" dominant-baseline="auto" text-anchor="start">7</text><text x="92" y="13" class="packetByte end" dominant-baseline="auto" text-anchor="end">5</text></g><g><rect x="1" y="62" width="251" height="32" class="packetBlock"></rect><text x="126.5" y="78" class="packetLabel" dominant-baseline="middle" text-anchor="middle">next</text><text x="1" y="60" class="packetByte start" dominant-baseline="auto" text-anchor="start">15</text><text x="252" y="60" class="packetByte end" dominant-baseline="auto" text-anchor="end">8</text></g><text x="129" y="117.5" dominant-baseline="middle" text-anchor="middle" class="packetTitle">Register</text></svg>