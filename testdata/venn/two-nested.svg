<svg id="mermaid-svg" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" style="max-width: 800px;" role="graphics-document document" aria-roledescription="venn"><style>#mermaid-svg{font-family:"Recursive Variable",arial,sans-serif;font-size:14px;fill:#28253D;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mermaid-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mermaid-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mermaid-svg .error-icon{fill:#ffffff;}#mermaid-svg .error-text{fill:#000000;stroke:#000000;}#mermaid-svg .edge-thickness-normal{stroke-width:2px;}#mermaid-svg .edge-thickness-thick{stroke-width:3.5px;}#mermaid-svg .edge-pattern-solid{stroke-dasharray:0;}#mermaid-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#mermaid-svg .edge-pattern-dashed{stroke-dasharray:3;}#mermaid-svg .edge-pattern-dotted{stroke-dasharray:2;}#mermaid-svg .marker{fill:#000000;stroke:#000000;}#mermaid-svg .marker.cross{stroke:#000000;}#mermaid-svg svg{font-family:"Recursive Variable",arial,sans-serif;font-size:14px;}#mermaid-svg p{margin:0;}#mermaid-svg .venn-title{font-size:32px;fill:#000000;font-family:"Recursive Variable",arial,sans-serif;}#mermaid-svg .venn-circle text{font-size:48px;font-family:"Recursive Variable",arial,sans-serif;}#mermaid-svg .venn-intersection text{font-size:48px;fill:#28253D;font-family:"Recursive Variable",arial,sans-serif;}#mermaid-svg .venn-text-node{font-family:"Recursive Variable",arial,sans-serif;color:#28253D;}#mermaid-svg .node .neo-node{stroke:#28253D;}#mermaid-svg [data-look="neo"].node rect,#mermaid-svg [data-look="neo"].cluster rect,#mermaid-svg [data-look="neo"].node polygon{stroke:#28253D;filter:url(#mermaid-svg-drop-shadow);}#mermaid-svg [data-look="neo"].swimlane.cluster rect{filter:none;}#mermaid-svg [data-look="neo"].node path{stroke:#28253D;stroke-width:2px;}#mermaid-svg [data-look="neo"].node .outer-path{filter:url(#mermaid-svg-drop-shadow);}#mermaid-svg [data-look="neo"].node .neo-line path{stroke:#28253D;filter:none;}#mermaid-svg [data-look="neo"].node circle{stroke:#28253D;filter:url(#mermaid-svg-drop-shadow);}#mermaid-svg [data-look="neo"].node circle .state-start{fill:#000000;}#mermaid-svg [data-look="neo"].icon-shape .icon{fill:#28253D;filter:url(#mermaid-svg-drop-shadow);}#mermaid-svg [data-look="neo"].icon-shape .icon-neo path{stroke:#28253D;filter:url(#mermaid-svg-drop-shadow);}#mermaid-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g></g><g transform="translate(0, 0)"><g class="venn-area venn-circle venn-set-0" data-venn-sets="A"><path d="M 400 225 
