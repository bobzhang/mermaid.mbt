<svg id="mermaid-svg" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 880px;" viewBox="0 0 880 680" role="graphics-document document" aria-roledescription="cynefin"><style>#mermaid-svg{font-family:verdana;font-size:16px;fill:#ccc;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mermaid-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mermaid-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mermaid-svg .error-icon{fill:#a44141;}#mermaid-svg .error-text{fill:#ddd;stroke:#ddd;}#mermaid-svg .edge-thickness-normal{stroke-width:1px;}#mermaid-svg .edge-thickness-thick{stroke-width:3.5px;}#mermaid-svg .edge-pattern-solid{stroke-dasharray:0;}#mermaid-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#mermaid-svg .edge-pattern-dashed{stroke-dasharray:3;}#mermaid-svg .edge-pattern-dotted{stroke-dasharray:2;}#mermaid-svg .marker{fill:lightgrey;stroke:lightgrey;}#mermaid-svg .marker.cross{stroke:lightgrey;}#mermaid-svg svg{font-family:verdana;font-size:16px;}#mermaid-svg p{margin:0;}#mermaid-svg .cynefinDomain{stroke:none;}#mermaid-svg .cynefinDomainLabel{font-size:20px;font-weight:bold;fill:#e0dfdf;}#mermaid-svg .cynefinSubtitle{font-size:13px;fill:#ccc;font-style:italic;}#mermaid-svg .cynefinItem{fill-opacity:0.95;stroke:#88ccff;stroke-width:1;}#mermaid-svg .cynefinItemText{font-size:14px;fill:#ccc;}#mermaid-svg .cynefinItemOverflow{fill-opacity:0.6;stroke:#88ccff;stroke-width:1;stroke-dasharray:3 2;}#mermaid-svg .cynefinBoundary{stroke:#88ccff;stroke-width:2;stroke-dasharray:6 3;}#mermaid-svg .cynefinCliff{stroke:#FF6B6B;stroke-width:7;}#mermaid-svg .cynefinConfusion{stroke:#88ccff;stroke-width:1.5;stroke-dasharray:4 2;}#mermaid-svg .cynefinArrowLine{stroke:orange;stroke-width:2;fill:none;}#mermaid-svg .cynefinArrowHead{fill:orange;stroke:none;}#mermaid-svg .cynefinArrowLabel{font-size:13px;fill:#ccc;}#mermaid-svg .cynefinTitle{font-size:22px;font-weight:bold;fill:#e0dfdf;}#mermaid-svg .node .neo-node{stroke:#ccc;}#mermaid-svg [data-look="neo"].node rect,#mermaid-svg [data-look="neo"].cluster rect,#mermaid-svg [data-look="neo"].node polygon{stroke:url(#mermaid-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaid-svg [data-look="neo"].swimlane.cluster rect{filter:none;}#mermaid-svg [data-look="neo"].node path{stroke:url(#mermaid-svg-gradient);stroke-width:1px;}#mermaid-svg [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaid-svg [data-look="neo"].node .neo-line path{stroke:#ccc;filter:none;}#mermaid-svg [data-look="neo"].node circle{stroke:url(#mermaid-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaid-svg [data-look="neo"].node circle .state-start{fill:#000000;}#mermaid-svg [data-look="neo"].icon-shape .icon{fill:url(#mermaid-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaid-svg [data-look="neo"].icon-shape .icon-neo path{stroke:url(#mermaid-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaid-svg :root{--mermaid-font-family:verdana;}</style><g></g><g transform="translate(40, 40)"><g class="cynefin-backgrounds"><rect class="cynefinDomain" x="0" y="0" width="400" height="300" fill="#224422" fill-opacity="0.4" stroke="none"></rect><rect class="cynefinDomain" x="400" y="0" width="400" height="300" fill="#0D47A1" fill-opacity="0.4" stroke="none"></rect><rect class="cynefinDomain" x="0" y="300" width="400" height="300" fill="#BF360C" fill-opacity="0.4" stroke="none"></rect><rect class="cynefinDomain" x="400" y="300" width="400" height="300" fill="#F57F17" fill-opacity="0.4" stroke="none"></rect></g><g class="cynefin-boundaries"><path class="cynefinBoundary" d="M401.75805616006255,0 C408.29205887112767,42.857142857142854 397.0338711878285,42.85714285714