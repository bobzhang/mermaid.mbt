<svg id="mermaid-svg" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 640px;" viewBox="0 0 640 540" role="graphics-document document" aria-roledescription="cynefin"><style>#mermaid-svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mermaid-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mermaid-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mermaid-svg .error-icon{fill:#552222;}#mermaid-svg .error-text{fill:#552222;stroke:#552222;}#mermaid-svg .edge-thickness-normal{stroke-width:1px;}#mermaid-svg .edge-thickness-thick{stroke-width:3.5px;}#mermaid-svg .edge-pattern-solid{stroke-dasharray:0;}#mermaid-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#mermaid-svg .edge-pattern-dashed{stroke-dasharray:3;}#mermaid-svg .edge-pattern-dotted{stroke-dasharray:2;}#mermaid-svg .marker{fill:#333333;stroke:#333333;}#mermaid-svg .marker.cross{stroke:#333333;}#mermaid-svg svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#mermaid-svg p{margin:0;}#mermaid-svg .cynefinDomain{stroke:none;}#mermaid-svg .cynefinDomainLabel{font-size:16px;font-weight:bold;fill:#131300;}#mermaid-svg .cynefinSubtitle{font-size:11px;fill:#333;font-style:italic;}#mermaid-svg .cynefinItem{fill-opacity:0.95;stroke:#333333;stroke-width:1;}#mermaid-svg .cynefinItemText{font-size:12px;fill:#333;}#mermaid-svg .cynefinItemOverflow{fill-opacity:0.6;stroke:#333333;stroke-width:1;stroke-dasharray:3 2;}#mermaid-svg .cynefinBoundary{stroke:#333333;stroke-width:2;stroke-dasharray:6 3;}#mermaid-svg .cynefinCliff{stroke:#8B0000;stroke-width:4;}#mermaid-svg .cynefinConfusion{stroke:#333333;stroke-width:1.5;stroke-dasharray:4 2;}#mermaid-svg .cynefinArrowLine{stroke:#333333;s