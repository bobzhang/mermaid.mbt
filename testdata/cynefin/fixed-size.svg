<svg id="mermaid-svg" width="1025" xmlns="http://www.w3.org/2000/svg" height="725" viewBox="0 0 1025 725" role="graphics-document document" aria-roledescription="cynefin"><style>#mermaid-svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mermaid-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mermaid-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mermaid-svg .error-icon{fill:#552222;}#mermaid-svg .error-text{fill:#552222;stroke:#552222;}#mermaid-svg .edge-thickness-normal{stroke-width:1px;}#mermaid-svg .edge-thickness-thick{stroke-width:3.5px;}#mermaid-svg .edge-pattern-solid{stroke-dasharray:0;}#mermaid-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#mermaid-svg .edge-pattern-dashed{stroke-dasharray:3;}#mermaid-svg .edge-pattern-dotted{stroke-dasharray:2;}#mermaid-svg .marker{fill:#333333;stroke:#333333;}#mermaid-svg .marker.cross{stroke:#333333;}#mermaid-svg svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#mermaid-svg p{margin:0;}#mermaid-svg .cynefinDomain{stroke:none;}#mermaid-svg .cynefinDomainLabel{font-size:16px;font-weight:bold;fill:#131300;}#mermaid-svg .cynefinSubtitle{font-size:11px;fill:#333;font-style:italic;}#mermaid-svg .cynefinItem{fill-opacity:0.95;stroke:#333333;stroke-width:1;}#mermaid-svg .cynefinItemText{font-size:12px;fill:#333;}#mermaid-svg .cynefinItemOverflow{fill-opacity:0.6;stroke:#333333;stroke-width:1;stroke-dasharray:3 2;}#mermaid-svg .cynefinBoundary{stroke:#333333;stroke-width:2;stroke-dasharray:6 3;}#mermaid-svg .cynefinCliff{stroke:#8B0000;stroke-width:4;}#mermaid-svg .cynefinConfusion{stroke:#333333;stroke-width:1.5;stroke-dasharray:4 2;}#mermaid-svg .cynefinArrowLine{stroke:#333333;stroke-width:2;fill:none;}#mermaid-svg .cynefinArrowHead{fill:#333333;stroke:none;}#mermaid-svg .cynefinArrowLabel{font-size:11px;fill:#333;}#mermaid-svg .cynefinTitle{font-size:18px;font-weight:bold;fill:#131300;}#mermaid-svg .node .neo-node{stroke:#9370DB;}#mermaid-svg [data-look="neo"].node rect,#mermaid-svg [data-look="neo"].cluster rect,#mermaid-svg [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].swimlane.cluster rect{filter:none;}#mermaid-svg [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#mermaid-svg [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#mermaid-svg [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].node circle .state-start{fill:#000000;}#mermaid-svg [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g></g><g transform="translate(12.5, 12.5)"><g class="cynefin-backgrounds"><rect class="cynefinDomain" x="0" y="0" width="500" height="350" fill="#E8F5E9" fill-opacity="0.4" stroke="none"></rect><rect class="cynefinDomain" x="500" y="0" width="500" height="350" fill="#E3F2FD" fill-opacity="0.4" stroke="none"></rect><rect class="cynefinDomain" x="0" y="350" width="500" height="350" fill="#FBE9E7" fill-opacity="0.4" stroke="none"></rect><rect class="cynefinDomain" x="500" y="350" width="500" height="350" fill="#FFF8E1" fill-opacity="0.4" stroke="none"></rect></g><g class="cynefin-boundaries"><path class="cynefinBoundary" d="M500,0 C500,50 500,50 500,100 C500,150 500,150 500,200 C500,250 500,250 500,300 C500,350 500,350 500,400 C500,450 500,450 500,500 C500,550 500,550 500,600 C500,650 500,650 500,700" fill="none"></path><path class="cynefinBoundary" d="M0,350 C71.42857142857143,350 71.42857142857143,350 142.85714285714286,350 C214.28571428571428,350 214.28571428571428,350 285.7142857142857,350 C357.1428571428571,350 357.1428571428571,350 428.57142857142856,350 C500,350 500,350 571.4285714285714,350 C642.8571428571429,350 642.8571428571429,350 714.2857142857143,350 C785.7142857142858,350 785.7142857142858,350 857.1428571428571,350 C928.5714285714286,350 928.5714285714286,350 1000,350" fill="none"></path><path class="cynefinCliff" d="M500,350 C530,420 455,542.5 515,612.5 C470,647.5 509,682.5 500,700" fill="none"></path></g><path class="cynefinConfusion" d="M350,350 A150,105 0 1,1 650,350 A150,105 0 1,1 350,350 Z" fill="#F3E5F5" fill-opacity="0.5"></path><g class="cynefin-labels"><text class="cynefinDomainLabel" x="250" y="145" text-anchor="middle" dominant-baseline="middle">Complex</text><text class="cynefinDomainLabel" x="750" y="145" text-anchor="middle" dominant-baseline="middle">Complicated</text><text class="cynefinDomainLabel" x="250" y="495" text-anchor="middle" dominant-baseline="middle">Chaotic</text><text class="cynefinDomainLabel" x="750" y="495" text-anchor="middle" dominant-baseline="middle">Clear</text><text class="cynefinDomainLabel" x="500" y="340" text-anchor="middle" dominant-baseline="middle">Confusion</text></g><g class="cynefin-subtitles"><text class="cynefinSubtitle" x="250" y="165" text-anchor="middle" dominant-baseline="middle">Probe → Sense → Respond</text><text class="cynefinSubtitle" x="250" y="180" text-anchor="middle" dominant-baseline="middle">Emergent Practices</text><text class="cynefinSubtitle" x="750" y="165" text-anchor="middle" dominant-baseline="middle">Sense → Analyse → Respond</text><text class="cynefinSubtitle" x="750" y="180" text-anchor="middle" dominant-baseline="middle">Good Practices</text><text class="cynefinSubtitle" x="2