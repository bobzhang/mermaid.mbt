<svg id="mermaid-svg" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 700px;" viewBox="0 0 700 700" overflow="visible" role="graphics-document document" aria-roledescription="radar"><style>#mermaid-svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mermaid-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mermaid-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mermaid-svg .error-icon{fill:hsl(228, 100%, 55%);}#mermaid-svg .error-text{fill:rgb(229.5, 183.6, 0);stroke:rgb(229.5, 183.6, 0);}#mermaid-svg .edge-thickness-normal{stroke-width:1px;}#mermaid-svg .edge-thickness-thick{stroke-width:3.5px;}#mermaid-svg .edge-pattern-solid{stroke-dasharray:0;}#mermaid-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#mermaid-svg .edge-pattern-dashed{stroke-dasharray:3;}#mermaid-svg .edge-pattern-dotted{stroke-dasharray:2;}#mermaid-svg .marker{fill:#0b0b0b;stroke:#0b0b0b;}#mermaid-svg .marker.cross{stroke:#0b0b0b;}#mermaid-svg svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#mermaid-svg p{margin:0;}#mermaid-svg .radarTitle{font-size:16px;color:rgb(229.5, 183.6, 0);dominant-baseline:hanging;text-anchor:middle;}#mermaid-svg .radarAxisLine{stroke:#ff0000;stroke-width:2;}#mermaid-svg .radarAxisLabel{font-size:12px;color:#ff0000;}#mermaid-svg .radarGraticule{fill:#DEDEDE;fill-opacity:0.3;stroke:#DEDEDE;stroke-width:1;}#mermaid-svg .radarLegendText{text-anchor:start;font-size:12px;dominant-baseline:hanging;}#mermaid-svg .radarCurve-0{color:hsl(48, 100%, 25%);fill:hsl(48, 100%, 25%);fill-opacity:0.5;stroke:hsl(48, 100%, 25%);stroke-width:2;}#mermaid-svg .radarLegendBox-0{fill:hsl(48, 100%, 25%);fill-opacity:0.5;stroke:hsl(48, 100%, 25%);}