<svg id="mermaid-svg" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 200px;" viewBox="0 -25 200 90" preserveAspectRatio="xMinYMin meet" height="115" role="graphics-document document" aria-roledescription="journey"><style>#mermaid-svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#000000;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mermaid-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mermaid-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mermaid-svg .error-icon{fill:#552222;}#mermaid-svg .error-text{fill:#552222;stroke:#552222;}#mermaid-svg .edge-thickness-normal{stroke-width:1px;}#mermaid-svg .edge-thickness-thick{stroke-width:3.5px;}#mermaid-svg .edge-pattern-solid{stroke-dasharray:0;}#mermaid-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#mermaid-svg .edge-pattern-dashed{stroke-dasharray:3;}#mermaid-svg .edge-pattern-dotted{stroke-dasharray:2;}#mermaid-svg .marker{fill:#666;stroke:#666;}#mermaid-svg .marker.cross{stroke:#666;}#mermaid-svg svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#mermaid-svg p{margin:0;}#mermaid-svg .label{font-family:"trebuchet ms",verdana,arial,sans-serif;color:#000000;}#mermaid-svg .mouth{stroke:#666;}#mermaid-svg line{stroke:#000000;}#mermaid-svg .legend{fill:#000000;font-family:"trebuchet ms",verdana,arial,sans-serif;}#mermaid-svg .label text{fill:#333;}#mermaid-svg .label{color:#000000;}#mermaid-svg .face{fill:#FFF8DC;stroke:#999;}#mermaid-svg .node rect,#mermaid-svg .node circle,#mermaid-svg .node ellipse,#mermaid-svg .node polygon,#mermaid-svg .node path{fill:#eee;stroke:#999;stroke-width:1px;}#mermaid-svg .node .label{text-align:center;}#mermaid-svg .node.clickable{cursor:pointer;}#mermaid-svg .arrowheadPath{fill:#333333;}#mermaid-svg .edgePaths .path{stroke:#666;stroke-width:1.5px;}#mermaid-svg .flowchart-link{stroke:#666;fill:none;}#mermaid-svg .edgeLabel{background-color:white;text-align:center;}#mermaid-svg .edgeLabel rect{opacity:0.5;}#mermaid-svg .cluster text{fill:#333;}#mermaid-svg div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:12px;background:hsl(-160, 0%, 93.3333333333%);border:1px solid #707070;border-radius:2px;pointer-events:none;z-index:100;}#mermaid-svg .task-type-0,#mermaid-svg .section-type-0{fill:#eee;}#mermaid-svg .task-type-1,#mermaid-svg .section-type-1{fill:hsl(0, 0%, 98.9215686275%);}#mermaid-svg .task-type-2,#mermaid-svg .section-type-2{fill:hsl(64, 0%, 93.3333333333%);}#mermaid-svg .task-type-3,#mermaid-svg .section-type-3{fill:hsl(64, 0%, 98.9215686275%);}#mermaid-svg .task-type-4,#mermaid-svg .section-type-4{fill:hsl(-64, 0%, 93.3333333333%);}#mermaid-svg .task-type-5,#mermaid-svg .section-type-5{fill:hsl(-64, 0%, 98.9215686275%);}#mermaid-svg .task-type-6,#mermaid-svg .section-type-6{fill:hsl(128, 0%, 93.3333333333%);}#mermaid-svg .task-type-7,#mermaid-svg .section-type-7{fill:hsl(128, 0%, 98.9215686275%);}#mermaid-svg .label-icon{display:inline-block;height:1em;overflow:visible;vertical-align:-0.125em;}#mermaid-svg .node .label-icon path{fill:currentColor;stroke:revert;stroke-width:revert;}#mermaid-svg .node .neo-node{stroke:#999;}#mermaid-svg [data-look="neo"].node rect,#mermaid-svg [data-look="neo"].cluster rect,#mermaid-svg [data-look="neo"].node polygon{stroke:url(#mermaid-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaid-svg [data-look="neo"].swimlane.cluster rect{filter:none;}#mermaid-svg [data-look="neo"].node path{stroke:url(#mermaid-svg-gradient);stroke-width:1px;}#mermaid-svg [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaid-svg [data-look="neo"].node .neo-line path{stroke:#999;filter:none;}#mermaid-svg [data-look="neo"].node circle{stroke:url(#mermaid-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaid-svg [data-look="neo"].node circle .state-start{fill:#000000;}#mermaid-svg [data-look="neo"].icon-shape .icon{fill:url(#mermaid-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaid-svg [data-look="neo"].icon-shape .icon-neo path{stroke:url(#mermaid-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaid-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g></g><defs><marker id="mermaid-svg-arrowhead" refX="5" refY="2" markerWidth="6" markerHeight="4" orient="auto"><path d="M 0,0 V 4 L6,2 Z"></path></marker></defs><text x="50" font-size="3" font-weight="bold" y="25" fill="blue" font-family="&quot;trebuchet ms&quot;, verdana, arial, sans-serif">many</text><line x1="50" y1="200" x2="146" y2="200" stroke-width="4" stroke="black" marker-end="url(#mermaid-svg-arrowhead)"></line></svg>