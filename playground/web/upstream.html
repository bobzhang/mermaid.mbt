<!doctype html>
<html><head><meta charset="utf-8"></head><body>
<!--
  mermaid.js renders here, on a blank page like the one the port is checked
  against: mermaid measures text in the page it runs in, so the playground's
  own styles must not reach it. The playground keeps this page in a 756×469
  frame, the size of that reference page.
-->
<script type="module">
const mermaid = (await import('https://cdn.jsdelivr.net/npm/mermaid@12.2.0/dist/mermaid.esm.min.mjs')).default;
await document.fonts.ready;
let queue = Promise.resolve();
window.addEventListener('message', (event) => {
  if (event.source !== parent) return;
  const { seq, text, config, id } = event.data;
  queue = queue.then(async () => {
    try {
      mermaid.initialize({ startOnLoad: false, ...config });
      const { svg } = await mermaid.render(id, text);
      parent.postMessage({ seq, svg }, '*');
    } catch (error) {
      parent.postMessage({ seq, error: String(error && error.message || error) }, '*');
    }
  });
});
parent.postMessage({ ready: true }, '*');
</script>
</body></html>
